  function replaceSdData(m, fileName, items, prev){
    var byKey = {}; items.forEach(function(i){ byKey[sdKey(i.sdCode)] = i; });
    var hist = Object.assign({}, state.sdhist || {});
    var added = 0, kept = 0, cleared = 0;
    var newIds = {}; items.forEach(function(i){ if(!i.carry) newIds[sdDocId(m, i.sdCode)] = true; });
    var tasksAll = state.allTasks || state.tasks;
    /* 1. the previous data: keep what is still in progress and in the new file, clear the rest */
    prev.forEach(function(sd){
      var k = sdKey(sd.sdCode), it = byKey[k];
      if(sdProgress(sd) === 100) hist[k] = sd.month;
      if(it && it.carry){
        var data = {orderQty:it.orderQty, pendingQty:it.pendingQty, lines:it.lines, poNos:it.poNos, cad:it.cad, gad:it.gad,
                    bom:it.bom, sfgCode:it.sfgCode, commDate:it.commDate, critical:it.critical, desc:it.desc || sd.desc, month:m};
        var nid = sdDocId(m, sd.sdCode);
        if(nid === sd.id){ saveSd(sd, data); }
        else {
          var moved = Object.assign({}, sd, data, {id:nid});
          saveSd(moved, {});
          tasksAll.filter(function(t){ return t.sdId === sd.id; }).forEach(function(t){ saveTask(t, {sdId:nid}); });
          deleteSd(sd);
        }
        kept++;
        return;
      }
      tasksAll.filter(function(t){ return t.sdId === sd.id && t.status !== "done"; }).forEach(function(t){ removeTask(t); });
      /* finished tasks of the old order stay as history but no longer point at the DB */
      tasksAll.filter(function(t){ return t.sdId === sd.id && t.status === "done"; }).forEach(function(t){ saveTask(t, {sdId:"", sdIdOld:sd.id, sdCode:sd.sdCode}); });
      if(newIds[sd.id]) state.sdbs = state.sdbs.filter(function(x){ return x.id !== sd.id; });   /* overwritten below */
      else deleteSd(sd);
      cleared++;
    });
    /* 2. the new file */
    items.forEach(function(i){
      if(i.carry) return;
      var sd = {id:sdDocId(m, i.sdCode), month:m, sdCode:i.sdCode, desc:i.desc, kind:i.kind,
                critical:i.critical, orderQty:i.orderQty, pendingQty:i.pendingQty, lines:i.lines,
                poNos:i.poNos, sfgItem:i.sfgItem, commDate:i.commDate, cad:i.cad, gad:i.gad,
                bom:i.bom, sfgCode:i.sfgCode, remarks:i.remarks || "", createdAt:today(), startDate:today(),
                startedAt:new Date().toISOString(), createdBy:state.who, steps:[], madeIn:i.prev || ""};
      sd.steps = buildSteps(sd);
      saveSd(sd, {});
      openStepTask(sd);
      added++;
    });
    /* 3. order records, notes and the history of finished codes */
    state.sdorders.filter(function(o){ return o.id !== m; }).forEach(function(o){
      if(state.db) state.db.doc("sdorders/" + o.id).delete().catch(onWriteErr);
    });
    state.sdnotes.forEach(function(n){ if(state.db) state.db.doc("sdnotes/" + n.id).delete().catch(onWriteErr); });
    state.sdnotes = [];
    state.sdhist = hist;
    if(state.db) state.db.doc("config/sdhistory").set({codes:hist}).catch(onWriteErr);
    var meta = {month:m, fileName:fileName, uploadedBy:state.who, uploadedAt:new Date().toISOString(),
                codes:items.length, newCodes:items.filter(function(i){ return i.kind === "new"; }).length};
    if(state.db) state.db.doc("sdorders/" + m).set(meta).catch(onWriteErr);
    state.sdorders = [Object.assign({id:m}, meta)];
    state.sdMonth = m;
    closeDrawer();
    banner((prev.length ? "Previous data saved to Excel and cleared (" + cleared + " DB" + (cleared === 1 ? "" : "s") + "). " : "") +
           monthName(m) + ": " + added + " DB" + (added === 1 ? "" : "s") + " loaded with their steps" +
           (kept ? ", " + kept + " in-progress DB" + (kept === 1 ? "" : "s") + " kept" : "") + ".");
    setTimeout(function(){ banner(""); }, 9000);
    render();
  }

  /* ---------- LIVE / QVE MONTHLY REPORT ---------- */
  function taskPlanDate(t){
    return t.plannedDate || t.firstDate || (t.createdAt || "").slice(0,10) || t.date || "";
  }
  function taskDelay(t){
    var p = taskPlanDate(t);
    if(!p) return null;
    if(t.status === "done") return dayDiff((t.doneAt || "").slice(0,10), p);
    var d = dayDiff(today(), p);
    return d > 0 ? d : 0;
  }
  function taskKind(t){
    var p = projById(t.projectId);
    if(p) return p.type === "qve" ? "qve" : "live";
    return t.sdId ? "sd" : "other";
  }
  function monthTasks(kind, mk){
    return state.tasks.filter(function(t){
      return taskKind(t) === kind && monthKey(taskPlanDate(t)) === mk;
    });
  }
  function taskMisses(list){
    var out = [];
    list.forEach(function(t){
      (t.misses || []).forEach(function(m){
        out.push({date:m.d, reason:m.reason || "Not given", note:m.note || "",
                  person:m.by || t.assignee, task:t, project:projById(t.projectId)});
      });
    });
    return out.sort(function(a,b){ return b.date.localeCompare(a.date); });
  }
  function reportPoints(kind, mk){
    var list = monthTasks(kind, mk);
    var done = list.filter(function(t){ return t.status === "done"; });
    var late = done.filter(function(t){ return taskDelay(t) > 0; });
    var ms = taskMisses(list);
    var pts = [];
    if(ms.length){
      var byReason = reasonCounts(ms);
      pts.push("Biggest time loss: " + byReason[0].label + " — " + byReason[0].v + " task-day" +
               (byReason[0].v === 1 ? "" : "s") + " of " + ms.length + " lost in the month.");
      var byPerson = {};
      ms.forEach(function(m){ byPerson[m.person] = (byPerson[m.person]||0) + 1; });
      var worst = Object.keys(byPerson).sort(function(a,b){ return byPerson[b] - byPerson[a]; })[0];
      if(worst) pts.push("Most blocked: " + memberName(worst) + " — " + byPerson[worst] + " task-days held up.");
      var byProj = {};
      ms.forEach(function(m){ if(m.project) byProj[m.project.id] = (byProj[m.project.id]||0) + 1; });
      var pw = Object.keys(byProj).sort(function(a,b){ return byProj[b] - byProj[a]; })[0];
      if(pw){
        var pp = projById(pw);
        pts.push("Worst-hit project: " + pp.id + " " + pp.customer + " — " + pp.name + " (" + byProj[pw] + " task-days).");
      }
    }
    if(done.length) pts.push("Finished on the planned day: " + Math.round((done.length - late.length)/done.length*100) +
      "% of " + done.length + " tasks.");
    var overdue = list.filter(function(t){ return t.status !== "done" && taskDelay(t) > 0; });
    if(overdue.length) pts.push(overdue.length + " task" + (overdue.length===1?"":"s") + " still open past the planned day.");
    var stale = state.projects.filter(function(p){
      if((kind === "qve") !== (p.type === "qve")) return false;
      if(!isActive(p)) return false;
      var last = (p.log && p.log.length) ? p.log[0].d : "";
      return !last || dayDiff(today(), last) > 7;
    });
    if(stale.length) pts.push(stale.length + " active " + (kind === "qve" ? "QVE idea" : "project") +
      (stale.length===1?"":"s") + " had no update for more than 7 days.");
    if(!pts.length) pts.push("No delay recorded yet for " + monthName(mk) + ".");
    return pts;
  }

    /* task schedule */

      el("h3",{},["Task schedule and delay"]),
      el("div",{class:"spacer", style:"flex:1"}),
      el("button",{class:"btn sm" + (state.repPending ? " primary" : ""), onclick:function(){
        state.repPending = !state.repPending; render();
      }},[state.repPending ? "Showing pending only" : "Show pending only"])
    ]));
    var t = el("table");
    t.appendChild(el("thead",{},[el("tr",{},[
      el("th",{},["Project"]), el("th",{},["Task"]), el("th",{},["With"]), el("th",{},["Planned"]),
      el("th",{},["Done"]), el("th",{class:"n"},["Delay"]), el("th",{class:"n"},["Held up"]), el("th",{},["Reason"])
    ])]));
    var tb = el("tbody");
    var rows = list.filter(function(x){ return !state.repPending || x.status !== "done"; })
      .sort(function(a,b){ return String(taskPlanDate(a)).localeCompare(String(taskPlanDate(b))); });
    if(!rows.length) tb.appendChild(el("tr",{},[el("td",{colspan:"8", class:"empty"},["No task recorded for " + monthName(mk) + "."])]));
    rows.forEach(function(x){

      var last = x.miss || ((x.misses && x.misses.length) ? x.misses[0] : null);
      tb.appendChild(el("tr",{class: p ? "clickable" : "", onclick:function(){ if(p) openProject(p.id); }},[
        el("td",{},[ p ? el("div",{},[ el("div",{class:"pname", style:"font-size:12.5px"},[p.customer + " — " + p.name]),
                                       el("div",{class:"psub"},[p.id]) ]) : "—" ]),
        el("td",{},[ el("div",{style:"font-size:12.5px"},[x.title]) ]),
        el("td",{},[shortName(x.assignee)]),
        el("td",{},[ taskPlanDate(x) ? fmtDate(taskPlanDate(x)) : "—" ]),
        el("td",{},[ x.doneAt ? fmtDate((x.doneAt||"").slice(0,10)) : "—" ]),
        el("td",{class:"n"},[ d === null ? "—" : (d > 0 ? "+" + d + " d" : "0") ]),
        el("td",{class:"n"},[ (x.misses && x.misses.length) ? String(x.misses.length) : "—" ]),

          return el("li",{style:"margin-bottom:6px"},[p]);

  function exportProjectMonth(kind, mk){
    if(typeof XLSX === "undefined"){ banner("Excel export could not load. Reload the page and try again."); return; }
    var label = kind === "qve" ? "QVE" : "Live";
    var list = monthTasks(kind, mk);
    var done = list.filter(function(t){ return t.status === "done"; });
    var late = done.filter(function(t){ return taskDelay(t) > 0; });
    var overdue = list.filter(function(t){ return t.status !== "done" && taskDelay(t) > 0; });
    var ms = taskMisses(list);
    var avg = done.length ? done.reduce(function(a,t){ return a + taskDelay(t); }, 0) / done.length : 0;
    var projs = state.projects.filter(function(p){ return (kind === "qve") === (p.type === "qve"); });
    var nid = kind + "-" + mk;
    var note = state.sdnotes.filter(function(x){ return x.id === nid; })[0];
    var wb = XLSX.utils.book_new();

    var sum = [
      ["NMD Design & Development — " + label + " projects, monthly record"],
      ["Month", monthName(mk)],
      ["Report taken on", new Date().toLocaleString("en-IN")],
      [],
      ["Tasks planned in the month", list.length],
      ["Finished", done.length],
      ["Finished late", late.length],
      ["Finished on the planned day %", done.length ? Math.round((done.length - late.length)/done.length*100) : ""],
      ["Open past the planned day", overdue.length],
      ["Average delay (days)", +avg.toFixed(2)],
      ["Task-days lost to hold-ups", ms.length],
      [],
      ["WHERE THE TIME WENT", "Task-days", "Share %"]
    ];
    reasonCounts(ms).forEach(function(r){
      sum.push([r.label, r.v, ms.length ? Math.round(r.v/ms.length*100) : 0]);
    });
    sum.push([]);
    sum.push(["IMPROVEMENT POINTS"]);
    reportPoints(kind, mk).forEach(function(p){ sum.push(["", p]); });
    if(note && note.text){ sum.push([]); sum.push(["Review notes", note.text]); }
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(sum), "Summary");

    var sch = [["Project","Customer","Project name","Task","With","Planned date","Done date","Delay (days)",
                "Days held up","Last reason","Reason note","Status"]];
    list.slice().sort(function(a,b){ return String(taskPlanDate(a)).localeCompare(String(taskPlanDate(b))); })
      .forEach(function(x){
        var p = projById(x.projectId);
        var d = taskDelay(x);
        var last = x.miss || ((x.misses && x.misses.length) ? x.misses[0] : null);
        sch.push([p ? p.id : "", p ? p.customer : "", p ? p.name : "", x.title, memberName(x.assignee),
                  taskPlanDate(x) || "", (x.doneAt || "").slice(0,10), d === null ? "" : d,
                  (x.misses || []).length, last ? last.reason : "", last ? (last.note || "") : "",
                  x.status === "done" ? (d > 0 ? "Finished late" : "Finished on time") : (d > 0 ? "Open — overdue" : "Open")]);
      });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(sch), "Task schedule");

    var hold = [["Date","Person","Reason","Task","Project","Customer","Priority","Note"]];
    ms.forEach(function(m){
      hold.push([m.date, memberName(m.person), m.reason, m.task.title,
                 m.project ? m.project.id : "", m.project ? m.project.customer : "",
                 m.project ? (m.project._band || "") : "", m.note]);
    });
    hold.push([]); hold.push(["Reason","Task-days"]);
    reasonCounts(ms).forEach(function(r){ hold.push([r.label, r.v]); });
    hold.push([]); hold.push(["Person","Task-days held up"]);
    state.team.forEach(function(m){
      hold.push([m.name, ms.filter(function(x){ return x.person === m.id; }).length]);
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(hold), "Where time went");

    var ph = kind === "qve"
      ? [["ID","Customer","Part","QVE project","Stage","Status","Owner","Priority","Saving per month (₹)","Target date","Last update","Last update on"]]
      : [["ID","Plant","Customer","Project","Stage","Status","Owner","Priority","Value per month (₹)","Target date","Last update","Last update on"]];
    projs.sort(function(a,b){ return bandRank(a) - bandRank(b); }).forEach(function(p){
      var last = (p.log && p.log.length) ? p.log[0] : null;
      var row = kind === "qve"
        ? [p.id, p.customer, p.part || "", p.name, p.stage||"", p.status||"", p.owner?memberName(p.owner):"",
           p._band||"", Math.round(p._value||0), p.targetDate||"", last?last.t:"", last?last.d:""]
        : [p.id, p.plant||"", p.customer, p.name, p.stage||"", p.status||"", p.owner?memberName(p.owner):"",
           p._band||"", Math.round(p._value||0), p.targetDate||"", last?last.t:"", last?last.d:""];
      ph.push(row);
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(ph), label + " projects");

    var stp = [["ID","Customer","Project","Step","Process step","Timeline","Planned","Done","Delay (days)","Status","Answer"]];
    var stLabel = {open:"Open", done:"Done", closed:"Enquiry closed"};
    projs.forEach(function(p){
      (p.steps || []).forEach(function(st){
        var d = pStepDelay(st);
        stp.push([p.id, p.customer, p.name, st.k, st.title, daysLabel(st.days), st.plan || "", st.doneAt || "",

  /* ---------- Tools tab ---------- */
  /* Sheet metal blank length (flat pattern) for a bent part.
     Blank = flanges + bend allowances, where for every bend
       BA  = π × A / 180 × (R + K × T)                       (length of the neutral line in the bend)
       OSSB = (R + T) × tan(A / 2)   (outside dims)   ISSB = R × tan(A / 2)   (inside dims)
     With outside dimensions: blank = Σ flanges − Σ (2 × OSSB − BA)   (bend deduction)
     With inside dimensions:  blank = Σ flanges − Σ (2 × ISSB) + Σ BA
     K-factor (neutral line position / T) is taken from DIN 6935 for the R / T ratio,
     with a small correction for the material, or typed in by hand. */
  var SM_MATERIALS = [
    {id:"crca", name:"CRCA / Mild steel", dk:0},
    {id:"hrpo", name:"HRPO", dk:0},
    {id:"gi", name:"GI / GP (galvanised)", dk:0},
    {id:"ss304", name:"Stainless steel 304", dk:0.02},
    {id:"ss316", name:"Stainless steel 316", dk:0.02},
    {id:"al", name:"Aluminium (5052 / 1100)", dk:-0.02},
    {id:"cu", name:"Copper / Brass", dk:-0.02}
  ];
  function smDefaults(){
    return {mat:"crca", t:1.6, r:1.6, dims:"outside", kMode:"auto", k:0.33,
            flanges:[50, 30, 50], bends:[{a:90, dir:1}, {a:90, dir:1}]};
  }
  function smLoad(){
    var v = null;
    try { v = JSON.parse(localStorage.getItem("pmi_dd_sm") || "null"); } catch(e){}
    if(!(v && v.flanges && v.bends)) v = smDefaults();
    if(!v.part || !v.part.edges) v.part = smPartDefaults();
    if(!v.mode) v.mode = "part";
    return v;
  }
  function smSave(v){ try { localStorage.setItem("pmi_dd_sm", JSON.stringify(v)); } catch(e){} }
  function smAutoK(mat, t, r){
    var ratio = t > 0 ? r / t : 1;
    var k = ratio >= 5 ? 1 : (ratio <= 0.1 ? 0.15 : 0.65 + 0.5 * Math.log10(ratio));   /* DIN 6935 correction factor */
    var m = SM_MATERIALS.filter(function(x){ return x.id === mat; })[0] || SM_MATERIALS[0];
    return Math.max(0.2, Math.min(0.5, k / 2 + m.dk));
  }
  function smCalc(v){
    var T = +v.t || 0, R = +v.r || 0;
    var K = v.kMode === "manual" ? (+v.k || 0) : smAutoK(v.mat, T, R);
    var rows = [], sumF = v.flanges.reduce(function(a, x){ return a + (+x || 0); }, 0), corr = 0;
    v.bends.forEach(function(b, i){
      var A = Math.max(1, Math.min(179, +b.a || 90)), rad = A * Math.PI / 180;
      var BA = rad * (R + K * T);
      var SB = (v.dims === "outside" ? (R + T) : R) * Math.tan(rad / 2);
      var c = v.dims === "outside" ? -(2 * SB - BA) : -(2 * SB) + BA;
      corr += c;
      rows.push({n:i + 1, a:A, ba:BA, sb:SB, bd:2 * SB - BA, c:c});
    });
    return {T:T, R:R, K:K, sumF:sumF, corr:corr, blank:sumF + corr, rows:rows};
  }
  function smProfileSvg(v, res){
    /* draw the bent part along its centre line, scaled to fit */
    var pts = [[0, 0]], ang = 0, x = 0, y = 0;
    v.flanges.forEach(function(L, i){
      L = Math.max(0, +L || 0);
      x += L * Math.cos(ang); y += L * Math.sin(ang); pts.push([x, y]);
      var b = v.bends[i]; if(b) ang += (b.dir || 1) * (Math.max(1, Math.min(179, +b.a || 90))) * Math.PI / 180;
    });
    var xs = pts.map(function(p){ return p[0]; }), ys = pts.map(function(p){ return p[1]; });
    var minX = Math.min.apply(null, xs), maxX = Math.max.apply(null, xs), minY = Math.min.apply(null, ys), maxY = Math.max.apply(null, ys);
    var w = Math.max(maxX - minX, 1), h = Math.max(maxY - minY, 1), W = 300, H = 170, pad = 22;
    var sc = Math.min((W - 2 * pad) / w, (H - 2 * pad) / h);
    var P = pts.map(function(p){ return [(pad + (p[0] - minX) * sc + ((W - 2 * pad) - w * sc) / 2).toFixed(1),
                                         (H - pad - (p[1] - minY) * sc - ((H - 2 * pad) - h * sc) / 2).toFixed(1)]; });
    var path = P.map(function(p, i){ return (i ? "L" : "M") + p[0] + " " + p[1]; }).join(" ");
    var labels = v.flanges.map(function(L, i){
      var a = P[i], b = P[i + 1]; if(!b) return "";
      var dx = b[0] - a[0], dy = b[1] - a[1], len = Math.sqrt(dx * dx + dy * dy) || 1;
      var nx = dy / len * 11, ny = -dx / len * 11;               /* label sits beside the line */
      return '<text x="' + ((+a[0] + +b[0]) / 2 + nx).toFixed(1) + '" y="' + ((+a[1] + +b[1]) / 2 + ny + 3).toFixed(1) + '" text-anchor="middle" class="smlbl">' + (+L || 0) + '</text>';
    }).join("");
    var dots = P.slice(1, -1).map(function(p){ return '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="3.2" class="smbend"/>'; }).join("");
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" class="smsvg" role="img" aria-label="Bent profile preview">' +
      '<path d="' + path + '" class="smpath"/>' + dots + labels + '</svg>';
  }

  /* ---------- 3D part: a flat plate with bends picked on its edges ----------
     The base plate is A (left → right) × B (front → back). Every edge can carry a
     chain of bends: bend 1 at the plate edge, then a flange of height h, then an
     optional return bend on that flange, and so on. The blank is
       X = A + flat(left) + flat(right)      Y = B + flat(front) + flat(back)
     where flat(edge) = Σ h − Σ 2·setback + Σ BA  (same rule as the profile mode). */
  var SM_EDGES = [
    {id:"front", name:"Front", axis:"Y"}, {id:"back", name:"Back", axis:"Y"},
    {id:"left", name:"Left", axis:"X"}, {id:"right", name:"Right", axis:"X"}
  ];
  var SM_DENSITY = {crca:7.85, hrpo:7.85, gi:7.85, ss304:7.93, ss316:7.98, al:2.68, cu:8.9};
  function smPartDefaults(){
    return {A:300, B:200, sel:"front", edges:{
      front:[{h:40, a:90, dir:1}], back:[{h:40, a:90, dir:1}],
      left:[{h:40, a:90, dir:1}], right:[{h:40, a:90, dir:1}] }};
  }
  function smBendRow(v, K, A){
    var T = +v.t || 0, R = +v.r || 0;
    A = Math.max(1, Math.min(179, +A || 90));
    var rad = A * Math.PI / 180, BA = rad * (R + K * T);
    var SB = (v.dims === "outside" ? (R + T) : R) * Math.tan(rad / 2);
    return {a:A, ba:BA, sb:SB, bd:2 * SB - BA, c:-(2 * SB) + BA};
  }
  function smPartCalc(v){
    var p = v.part, T = +v.t || 0, R = +v.r || 0;
    var K = v.kMode === "manual" ? (+v.k || 0) : smAutoK(v.mat, T, R);
    var edges = {};
    SM_EDGES.forEach(function(e){
      var list = p.edges[e.id] || [], rows = list.map(function(s){ return smBendRow(v, K, s.a); });
      var sumH = list.reduce(function(a, s){ return a + (+s.h || 0); }, 0);
      var corr = rows.reduce(function(a, r){ return a + r.c; }, 0);
      /* positions along the flat strip, measured from the outer edge of the blank */
      var pos = [], straight = [];
      list.forEach(function(s, i){
        var st = (+s.h || 0) - rows[i].sb - (rows[i + 1] ? rows[i + 1].sb : 0);
        straight.push(st);
      });
      var run = 0;

          var col = function(names){ for(var k = 0; k < names.length; k++){ var j = hd.indexOf(names[k]); if(j >= 0) return j; } return -1; };

          });

          var score = list.length + (/master/i.test(name) ? 100000 : 0);
          if(!items || score > itemsScore){ items = list; itemsScore = score; itemsSheet = name; }
          return;
        }
        var iErp = hd.indexOf("erp code"), iLand = hd.indexOf("landed cost"), iRate = hd.indexOf("rate");

    var wasOpen = $("#drawer").classList.contains("open");
    var b = $("#dBody"); b.innerHTML = ""; b.appendChild(body);
    if(!wasOpen){                                 /* sections slide in only when the panel opens */
      b.classList.remove("fresh"); void b.offsetWidth; b.classList.add("fresh");
      clearTimeout(drawer._t); drawer._t = setTimeout(function(){ b.classList.remove("fresh"); }, 900);
    }
    $("#drawer").classList.add("open"); $("#drawer").setAttribute("aria-hidden","false");
    $("#scrim").classList.add("open");
  }
  function closeDrawer(){
    state.drawer = null;
    $("#drawer").classList.remove("open"); $("#drawer").setAttribute("aria-hidden","true");
    $("#scrim").classList.remove("open");
  }
  $("#dClose").onclick = closeDrawer;
  $("#scrim").onclick = closeDrawer;
  document.addEventListener("keydown", function(e){ if(e.key === "Escape") closeDrawer(); });

  /* ---------- render ---------- */
  function runDataCheck(){
    var out = el("div",{style:"font-size:12.5px;line-height:1.7"});
    var box = el("div",{class:"card"},[el("div",{class:"cardbody"},[out])]);
    function line(t){ out.appendChild(el("div",{},[t])); }
    drawer("Data check", "What the page can and cannot read right now", box);
    line("1. Runtime object: " + (window.claude && window.claude.use ? "found" : "MISSING"));
    if(!(window.claude && window.claude.use)) return;
    window.claude.use("db").then(function(db){
      line("2. Data store: " + (db ? "opened" : "NOT GRANTED"));
      if(!db) return;
      var tests = [
        ["collection('projects').get()", function(){ return db.collection("projects").get().then(function(s){ return s.docs.length + " documents"; }); }],
        ["doc('projects/LP-001').get()", function(){ return db.doc("projects/LP-001").get().then(function(s){ return s.exists ? "exists" : "does not exist"; }); }],
        ["collection('projects').limit(1).get()", function(){ return db.collection("projects").limit(1).get().then(function(s){ return s.docs.length + " documents"; }); }],
        ["doc('config/team').get()", function(){ return db.doc("config/team").get().then(function(s){ return s.exists ? "exists" : "does not exist"; }); }],
        ["write test doc", function(){ return db.doc("config/_check").set({at:new Date().toISOString()}).then(function(){ return "write ok"; }); }]
      ];
      var i = 0;
      (function next(){
        if(i >= tests.length){
          var snapDone = false;
          var un = db.collection("projects").onSnapshot(function(sn){
            snapDone = true; line("Live updates: delivered " + sn.docs.length + " documents"); try{ un(); }catch(e){}
          }, function(e){ snapDone = true; line("Live updates: FAILED — " + errText(e)); });
          setTimeout(function(){ if(!snapDone) line("Live updates: no answer in 8 seconds"); }, 8000);
          return;
        }
        var t = tests[i++];
        try{
          t[1]().then(function(r){ line((i+2) + ". " + t[0] + " → " + r); next(); })
                .catch(function(e){ line((i+2) + ". " + t[0] + " → FAILED: " + errText(e)); next(); });
        }catch(e){ line((i+2) + ". " + t[0] + " → THREW: " + errText(e)); next(); }
      })();
    }).catch(function(e){ line("2. Data store: FAILED — " + errText(e)); });
  }
  function statusLine(){
    var d = state.diag;
    return el("p",{class:"muted", style:"font-size:11.5px;margin:22px 0 0;text-align:right"},[
      "Data: " + (d.store ? (d.loaded || "connected") : (d.claude ? "connecting…" : "not connected")) +
      (d.err ? " · " + d.err : ""),
      el("button",{class:"btn ghost sm", style:"margin-left:8px", onclick:function(){
        if(state.db) loadOnce(state.db); else connect();
      }},["Reload data"]),
      el("button",{class:"btn ghost sm", style:"margin-left:4px", onclick:runDataCheck},["Data check"])
    ]);
  }
  function subTabs(){
    var bar = el("div",{class:"subtabs", role:"tablist", "aria-label":"Project lists"});
    [["live","Live Projects"],["qve","QVE Projects"],["special","Special DBs"]].forEach(function(t){
      bar.appendChild(el("button",{role:"tab", "data-sub":t[0], "aria-selected": state.sub === t[0] ? "true" : "false",
        onclick:function(){
          state.sub = t[0]; lsSet("pmi_dd_sub", state.sub); saveView(); state.enterAnim = true;
          window.scrollTo({top:0, behavior:"instant"});
          render();
        }},[t[1]]));
    });
    return bar;
  }
  var THEMES = ["system","light","dark"];
  function applyTheme(){
    var t = lsGet("pmi_dd_theme","system");
    if(THEMES.indexOf(t) < 0) t = "system";
    if(t === "system") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", t);
    var b = $("#themeBtn");
    if(b){
      b.textContent = t === "system" ? "Auto" : (t === "light" ? "Light" : "Dark");
      b.title = "Colours: " + (t === "system" ? "follow this device" : t) + " — click to change";
    }
  }
  function cycleTheme(){
    var t = lsGet("pmi_dd_theme","system");
    var i = THEMES.indexOf(t); if(i < 0) i = 0;
    lsSet("pmi_dd_theme", THEMES[(i+1) % THEMES.length]);
    applyTheme(); syncHeader();
  }
  function syncHeader(){
    var h = document.querySelector("header.top");
    if(h && !h.hidden) document.documentElement.style.setProperty("--hdr-h", h.offsetHeight + "px");
  }
  function paintTabCounts(){
    var who = state.who;
    var mine = function(t){ return isLead(who) ? true : t.assignee === who; };
    var due = state.tasks.filter(function(t){
      return t.status !== "done" && mine(t) && dayDiff(t.date, today()) <= 0;
    }).length;
    var proj = state.projects.filter(function(p){
      return isActive(p) && (isLead(who) || p.owner === who || !p.owner);
    }).length;
    [["#tcToday", due, "open today"], ["#tcProjects", proj, "active projects"]].forEach(function(x){
      var n = $(x[0]); if(!n) return;
      n.textContent = String(x[1]);
      n.title = x[1] + " " + x[2];
      n.hidden = !x[1];
    });
  }
  /* how many active projects sit at each stage */
  function stagePipeline(kind){
    var stages = stagesFor(kind === "qve" ? "qve" : "live");
    var list = state.projects.filter(function(p){
      return (kind === "qve" ? p.type === "qve" : p.type !== "qve") && isActive(p);
    });
    var rows = stages.map(function(st){
      var items = list.filter(function(p){ return p.stage === st; });
      return {label:st, v:items.length, money:items.reduce(function(s,p){ return s + p._value; }, 0)};
    });
    var noStage = list.filter(function(p){ return !p.stage; });
    if(noStage.length) rows.push({label:"Stage not set", v:noStage.length,
      money:noStage.reduce(function(s,p){ return s + p._value; }, 0)});
    rows = rows.filter(function(r){ return r.v > 0; });
    if(rows.length < 2) return null;
    var stuck = rows.slice().sort(function(a,b){ return b.v - a.v; })[0];
    return el("div",{class:"card", style:"margin-bottom:12px"},[
      el("div",{class:"cardhead"},[
        el("h3",{},["Where the projects stand"]),
        el("p",{class:"muted", style:"margin:0;font-size:12.5px"},
          ["Most work sits at " + stuck.label.replace(/^\d+\.\s*/,"") + " — " + stuck.v + " of " + list.length + "."])
      ]),
      el("div",{class:"cardbody"},[ barList(rows.map(function(r){
        return {label:r.label, v:r.v,
                amt: r.v + (r.v === 1 ? " project" : " projects") + (r.money ? " · " + inr(r.money) : "")};
      }), function(v){ return String(v); }) ])
    ]);
  }
  /* last N months of value handed over */
  function monthTrend(n){
    var out = [];
    for(var i = n - 1; i >= 0; i--){
      var mk = shiftMonth(state.monthOffset - i);
      var done = state.projects.filter(function(p){ return p.completedOn && monthKey(p.completedOn) === mk; });
      out.push({mk:mk, label:monthName(mk).slice(0,3), v:done.reduce(function(s,p){ return s + p._value; }, 0),
                n:done.length, now: i === 0});
    }
    return out;
  }
  function colChart(rows, fmt){
    var max = rows.reduce(function(m,r){ return Math.max(m, r.v); }, 0) || 1;
    return el("div",{class:"cols"}, rows.map(function(r){
      return el("div",{class:"col" + (r.now ? " now" : ""),
        title:monthName(r.mk) + " — " + fmt(r.v) + " · " + r.n + (r.n===1?" project":" projects")},[
        el("span",{class:"cv"},[r.v ? fmt(r.v) : "—"]),
        el("div",{class:"cbar"},[ el("i",{style:"height:" + (r.v ? Math.max(3, Math.round(r.v/max*100)) : 0) + "%"}) ]),
        el("span",{class:"cl"},[r.label])
      ]);
    }));
  }

  /* ---------- CAD workspace chrome: path bar, title block, status bar ---------- */
  var CAD_TABS = ["today","projects","customers","team","value","tools"];
  var CAD_NAMES = {today:"Today's Work", projects:"Projects", customers:"Customers", team:"Team", value:"Value", tools:"Tools"};
  var CAD_SUBS = {live:"Live Projects", qve:"QVE Projects", special:"Special DBs"};
  var cadXY = {x:0, y:0};
  function cadSvgProj(){
    return '<svg viewBox="0 0 44 18" width="34" height="14" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M2 2v14l14-4V6z"/><circle cx="33" cy="9" r="7"/><circle cx="33" cy="9" r="3.5"/></svg>';
  }
  function paintCad(){
    document.body.classList.add("cad");
    if(!state.auth){
      var sbc = $("#statusBar");
      if(sbc){
        sbc.innerHTML = "";
        sbc.appendChild(el("span",{},[el("i",{class:"dot"}), el("b",{},[state.ready ? "Ready" : "Loading…"])]));
        sbc.appendChild(el("span",{id:"sbXY"},[cadXYText()]));
        sbc.appendChild(el("span",{},[state.pinFor ? "Enter the PIN for " : "Select your name to sign in",
          state.pinFor ? el("b",{},[memberName(state.pinFor)]) : null]));
        sbc.appendChild(el("span",{class:"sp"}));
        sbc.appendChild(el("span",{},["Sheet ", el("b",{},["0 / " + CAD_TABS.length])]));
        sbc.appendChild(el("span",{},["Version ", el("b",{},[APP_VERSION])]));
        sbc.appendChild(el("span",{},["MMGS"]));
        sbc.appendChild(el("span",{},["Grid ", el("b",{},["ON"])]));
      }
      return;
    }
    var tab = CAD_NAMES[state.tab] ? state.tab : "today";
    var idx = CAD_TABS.indexOf(tab);
    var sub = tab === "projects" ? (CAD_SUBS[state.sub] || CAD_SUBS.live) : "";
    var dateTxt = new Date().toLocaleDateString("en-IN",{day:"2-digit", month:"short", year:"numeric"});
    var me = memberName(state.who);
    var crumb = $("#crumb");
    if(crumb){
      crumb.innerHTML = "";
      var path = el("div",{class:"path"},[el("b",{},["NMD_DEVELOPMENT"]), el("span",{class:"sep"},["›"]),
        el("span",{class: sub ? "" : "cur"},[CAD_NAMES[tab]])]);
      if(sub){ path.appendChild(el("span",{class:"sep"},["›"])); path.appendChild(el("span",{class:"cur"},[sub])); }
      var meta = el("div",{class:"meta"},[
        el("span",{class:"opt"},["SHEET " + (idx + 1) + " / " + CAD_TABS.length]),
        el("span",{class:"opt"},["SCALE 1:1"]),
        el("span",{},["mm"])
      ]);
      var pj = el("span",{class:"opt", title:"First-angle projection"}); pj.innerHTML = cadSvgProj(); meta.appendChild(pj);
      crumb.appendChild(path); crumb.appendChild(el("span",{class:"sp"})); crumb.appendChild(meta);
    }
    var tb = $("#cadTb");
    if(tb){
      tb.innerHTML = "";
      var cell = function(k, v, cls){ return el("div",{class:cls || ""},[el("span",{class:"k"},[k]), el("span",{class:"v", title:v},[v])]); };
      [cell("Drawn", me), cell("Checked", HEAD.name.split(" (")[0]), cell("Approved", OWNER.name.split(" (")[0]),
       cell("Title", CAD_NAMES[tab] + (sub ? " — " + sub : ""), "ttl"),
       cell("Dwg no.", "NMD-DD-0" + (idx + 1) + (sub ? "-" + (state.sub || "live").charAt(0).toUpperCase() : "")),
       cell("Date", dateTxt), cell("Rev", "A")].forEach(function(c){ tb.appendChild(c); });
    }
    var pu = $("#pUser"); if(pu){ pu.textContent = me; pu.title = me; }
    var pd = $("#pDate"); if(pd) pd.textContent = dateTxt;
    var sb = $("#statusBar");
    if(sb){
      var who = state.who;
      var mine = function(t){ return isLead(who) ? true : t.assignee === who; };
      var open = state.tasks.filter(function(t){ return t.status !== "done" && mine(t); });
      var due = open.filter(function(t){ return dayDiff(t.date, today()) <= 0; }).length;
      var late = open.filter(function(t){ return dayDiff(t.date, today()) < 0; }).length;
      sb.innerHTML = "";
      sb.appendChild(el("span",{},[el("i",{class:"dot"}), el("b",{},[state.ready ? "Ready" : "Loading…"])]));
      sb.appendChild(el("span",{id:"sbXY"},[cadXYText()]));
      sb.appendChild(el("span",{},["Editing ", el("b",{},[CAD_NAMES[tab] + (sub ? " › " + sub : "")])]));
      sb.appendChild(el("span",{class:"sp"}));
      sb.appendChild(el("span",{},[el("b",{},[String(due)]), " due"]));
      sb.appendChild(el("span",{class:"late"},[el("b",{},[String(late)]), " late"]));
      sb.appendChild(el("span",{title:"No tasks are planned on Saturday"},["Weekly off ", el("b",{},["SAT"])]));
      sb.appendChild(el("span",{title:"Dashboard version — leave cover, project on hold, monthly orders, Saturday off"},["Version ", el("b",{},[APP_VERSION])]));
      sb.appendChild(el("span",{},["MMGS"]));
      sb.appendChild(el("span",{},["Grid ", el("b",{},["ON"])]));
    }
  }
  function cadXYText(){
    return "X " + cadXY.x.toFixed(2) + "   Y " + cadXY.y.toFixed(2) + "   Z 0.00 mm";
  }
  (function(){
    var pending = false;
    document.addEventListener("mousemove", function(e){
      if(!document.body.classList.contains("cad")) return;
      var m = document.querySelector("main"); if(!m) return;
      var r = m.getBoundingClientRect();
      cadXY.x = Math.max(0, (e.clientX - r.left) * 0.2646);
      cadXY.y = Math.max(0, (window.innerHeight - e.clientY) * 0.2646);
      if(pending) return; pending = true;
      requestAnimationFrame(function(){ pending = false; var n = $("#sbXY"); if(n) n.textContent = cadXYText(); });
    }, {passive:true});
  })();
  function render(){
    computePriority();
    var v = $("#view"); v.innerHTML = "";
    var hdr = document.querySelector("header.top");
    document.body.classList.toggle("signedout", !state.auth);
    paintCad();
    if(!state.auth){
      document.body.removeAttribute("data-sec");
      if(hdr) hdr.hidden = false;
      paintWho();
      setTimeout(syncHeader, 0);
      v.appendChild(viewCover());
      v.appendChild(statusLine());
      return;
    }
    if(hdr) hdr.hidden = false;
    document.body.setAttribute("data-sec", state.tab);
    paintWho();
    paintTabCounts();
    setTimeout(syncHeader, 0);
    if(state.tab === "projects"){
      v.appendChild(subTabs());
      if(state.sub === "qve") v.appendChild(viewQve());
      else if(state.sub === "special") v.appendChild(viewSpecial());
      else v.appendChild(viewLive());
    }
    else if(state.tab === "customers") v.appendChild(viewCustomers());
    else if(state.tab === "team") v.appendChild(viewTeam());
    else if(state.tab === "value") v.appendChild(viewValue());
    else if(state.tab === "tools") v.appendChild(viewTools());
    else v.appendChild(viewToday());
    v.appendChild(statusLine());
    if(state.enterAnim && state.ready){ state.enterAnim = false; playEnter(v); }
    else v.classList.remove("enter");
    checkNotices();
  }
  /* entrance motion for a fresh view: sections rise in turn, bars grow,
     headline numbers count up; skipped when the viewer asks for less motion */
  function playEnter(v){
    var calm = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    v.classList.remove("enter");
    if(calm) return;
    void v.offsetWidth;
    v.classList.add("enter");
    var items = v.querySelectorAll(".subtabs, .blockhead, .tiles > .tile, .filters, #view > div > .card, #view > div > section > .card, #view > div > div > .card, #view > div > section.block > .tiles > .tile");
    var seen = [], k = 0;
    Array.prototype.forEach.call(items, function(n){
      if(seen.indexOf(n) >= 0) return; seen.push(n);
      if(k < 14){ n.classList.add("rise"); n.style.animationDelay = (k * 45) + "ms"; }
      k++;
    });
    Array.prototype.forEach.call(v.querySelectorAll(".tile .val"), function(el){ countUp(el); });
  }
  function countUp(el){
    var txt = el.textContent, m = /^(\D*?)([\d,]+(?:\.\d+)?)(.*)$/.exec(txt);
    if(!m) return;
    var target = parseFloat(m[2].replace(/,/g, "")); if(!isFinite(target) || target === 0) return;
    var dec = (m[2].split(".")[1] || "").length, grouped = m[2].indexOf(",") >= 0;
    var t0 = null, dur = 750;
    function fmt(x){
      var s2 = dec ? x.toFixed(dec) : String(Math.round(x));
      return grouped ? Number(s2).toLocaleString("en-IN", {minimumFractionDigits:dec, maximumFractionDigits:dec}) : s2;
    }
    function step(ts){
      if(!el.isConnected) return;
      if(t0 === null) t0 = ts;
      var p = Math.min(1, (ts - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      el.textContent = m[1] + fmt(target * e) + m[3];
      if(p < 1) requestAnimationFrame(step); else el.textContent = txt;
    }
    requestAnimationFrame(step);
  }

  /* a window left open overnight: notice the date change, move untouched
     tasks to the new day and redraw, so nobody sees yesterday's screen */
  setInterval(function(){ try { paintWho(); } catch(e){} }, 60000);   /* greeting follows the clock */
  var dayWatch = today();
  setInterval(function(){
    if(today() === dayWatch) return;
    dayWatch = today();
    state.planRan = false;
    state.balChecked = false;
    rollForward();
    ensureDailyBalance();
    maybeBuildDailyPlan();
    render();
  }, 120000);

  boot();
})();
</script>
