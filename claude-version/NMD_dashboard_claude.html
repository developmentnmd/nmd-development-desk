  *{box-sizing:border-box}
  [hidden]{display:none !important}
  /* wireframe mechanical drawing behind the page */
  body::before{content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:var(--blueprint); background-size:520px 520px; background-position:18px -40px}
  body.signedout::before{display:none}
  body{
    margin:0; background:var(--surface); color:var(--ink);
    font-family:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
    font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{font-family:Archivo,"IBM Plex Sans",system-ui,sans-serif; margin:0; text-wrap:balance; letter-spacing:-.01em}
  .num{font-variant-numeric:tabular-nums}
  button,select,input,textarea{font:inherit; color:inherit}
  button{cursor:pointer}
  a{color:var(--brand)}

  /* header */
  header.top{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:30;
    background:var(--paper); border-bottom:1px solid var(--line);
    box-shadow:0 1px 3px rgba(15,15,20,.035);
  }
  .topin{max-width:1240px; margin:0 auto; padding:12px 18px; display:flex; gap:12px; align-items:center; flex-wrap:wrap}
  .mark{width:36px; height:36px; border-radius:8px; background:var(--ink); color:var(--paper);
    display:grid; place-items:center; font-family:Archivo; font-weight:700; font-size:12.5px; letter-spacing:.04em; flex:none;
    box-shadow:0 1px 2px rgba(0,0,0,.16)}
  .brandtext h1{font-size:16.5px; font-weight:700; line-height:1.15; letter-spacing:-.015em}
  .brandtext p{margin:2px 0 0; font-size:10.5px; color:var(--ink3); text-transform:uppercase; letter-spacing:.11em; font-weight:500}
  .topright{margin-left:auto; display:flex; gap:12px; align-items:center; flex-wrap:wrap}
  .whoami{display:flex; align-items:center; gap:7px; background:var(--surface); border:1px solid var(--line2);
    border-radius:999px; padding:4px 6px 4px 12px}
  .whoami span{font-size:10.5px; text-transform:uppercase; letter-spacing:.1em; color:var(--ink3); white-space:nowrap; font-weight:500}
  .whoami select{border:0; background:transparent; font-weight:600; padding:3px 4px; border-radius:999px}
  .datechip{font-size:12.5px; color:var(--ink3); white-space:nowrap; padding-left:12px; border-left:1px solid var(--line)}
  nav.tabs{max-width:1240px; margin:0 auto; padding:0 14px 9px; display:flex; gap:4px; overflow-x:auto; scrollbar-width:none}
  nav.tabs::-webkit-scrollbar{display:none}
  nav.tabs button{
    border:1px solid transparent; background:transparent; padding:7px 12px; font-weight:600; color:var(--ink2);
    border-radius:7px; white-space:nowrap; font-size:13px; letter-spacing:.005em; transition:background .12s, color .12s;
  }
  nav.tabs button:hover{color:var(--ink); background:var(--surface)}
  nav.tabs button[aria-selected="true"]{color:var(--brand); background:var(--brand-soft); border-color:var(--brand-soft)}

  .subtabs{display:flex; gap:4px; margin-bottom:16px; background:var(--raise); border:1px solid var(--line);
    border-radius:10px; padding:4px; width:max-content; max-width:100%; overflow-x:auto; scrollbar-width:none;
    box-shadow:var(--shadow)}
  .subtabs::-webkit-scrollbar{display:none}
  .subtabs button{border:0; background:transparent; color:var(--ink2); font-weight:600; font-size:13px;
    padding:7px 15px; border-radius:7px; white-space:nowrap; transition:background .12s, color .12s}
  .subtabs button:hover{color:var(--ink); background:var(--surface)}
  .subtabs button[aria-selected="true"]{background:var(--brand); color:var(--brand-ink)}
  @media (prefers-reduced-motion:reduce){.subtabs button{transition:none}}

  main{max-width:1240px; margin:0 auto; padding-block:22px 72px; padding-left:16px; padding-right:16px;
    position:relative; z-index:1}
  .banner{border:1px solid var(--line); background:var(--warn-soft); color:var(--warn);
    padding:10px 12px; border-radius:var(--r); margin-bottom:14px; font-size:13px}

  section.block{margin-bottom:30px}
  .blockhead{display:flex; align-items:baseline; gap:10px; margin-bottom:10px; flex-wrap:wrap}
  .blockhead h2{font-size:16px; font-weight:600; letter-spacing:-.015em}
  .blockhead p{margin:0; color:var(--ink3); font-size:12.5px}
  .blockhead .spacer{flex:1}

  .tiles{display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
  .tile{background:var(--raise); border:1px solid var(--line); border-radius:10px; padding:14px 16px; box-shadow:var(--shadow)}
  .tile .lab{font-size:10.5px; text-transform:uppercase; letter-spacing:.1em; color:var(--ink3); font-weight:600}
  .tile .val{font-family:Archivo; font-weight:700; font-size:27px; line-height:1.12; margin-top:6px; letter-spacing:-.02em; font-variant-numeric:tabular-nums}
  .tile .sub{font-size:11.5px; color:var(--ink3); margin-top:3px}
  .tile.alert .val{color:var(--crit)}
  .tile.money .val{color:var(--ink)}

  .card{background:var(--raise); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow)}
  .card + .card{margin-top:10px}
  .cardhead.stick{position:sticky; top:calc(var(--hdr-h,104px) + env(safe-area-inset-top,0px)); z-index:5}
  .barlist.bad .track > i{background:var(--crit)}
  .cardhead{padding:12px 15px; border-bottom:1px solid var(--line2); display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    background:var(--surface); border-radius:10px 10px 0 0}
  .cardhead h3{font-size:13.5px; font-weight:600; letter-spacing:-.005em}
  .cardbody{padding:14px 15px}
  .muted{color:var(--ink3)}
  .empty{padding:26px 15px; color:var(--ink3); font-size:13px; text-align:center}
  .empty::before{content:""; display:block; width:92px; height:84px; margin:0 auto 8px;
    background:var(--mark-art) no-repeat center; background-size:contain}

  /* task rows */
  .taskgroup{position:sticky; top:calc(var(--hdr-h,104px) + env(safe-area-inset-top,0px)); z-index:6;
    display:flex; align-items:center; gap:9px; padding:8px 15px; background:var(--surface);
    border-top:1px solid var(--line2); font-size:10.5px; text-transform:uppercase; letter-spacing:.1em;
    font-weight:600; color:var(--ink3)}
  .taskgroup .n{letter-spacing:0; font-size:11px; color:var(--ink2); background:var(--raise);
    border:1px solid var(--line2); border-radius:999px; padding:0 7px}
  .task{display:flex; gap:12px; align-items:flex-start; padding:12px 15px; border-top:1px solid var(--line2)}
  .task:first-child{border-top:0}
  .task:hover{background:var(--surface)}
  .task.b-P1{box-shadow:inset 3px 0 0 var(--crit)}
  .task.b-P2{box-shadow:inset 3px 0 0 var(--warn)}
  .task.b-P3{box-shadow:inset 3px 0 0 var(--line)}
  .task.done{box-shadow:inset 3px 0 0 var(--good)}
  .task.done .tt{text-decoration:line-through; color:var(--ink3)}
  .tick{width:20px; height:20px; border-radius:5px; border:1.5px solid var(--line); background:var(--paper);
    flex:none; margin-top:1px; display:grid; place-items:center; color:transparent; font-size:12px; font-weight:700}
  .tick:hover{border-color:var(--brand)}
  .task.done .tick{background:var(--good); border-color:var(--good); color:#fff}
  .taskmain{flex:1; min-width:0}
  .tt{font-weight:500; font-size:13.8px}
  .tmeta{display:flex; gap:5px; flex-wrap:wrap; margin-top:6px; align-items:center}
  .taskact{display:flex; gap:6px; align-items:center; flex:none}

  .ring{flex:none; display:grid; place-items:center; margin-top:1px}
  .agedot{display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:600; color:var(--ink3);
    font-variant-numeric:tabular-nums; white-space:nowrap}
  .agedot i{width:7px; height:7px; border-radius:50%; display:block}
  .agedot.a-ok i{background:var(--good)}
  .agedot.a-warn i{background:var(--warn)}
  .agedot.a-bad i{background:var(--crit)}
  .agedot.a-warn{color:var(--warn)}
  .agedot.a-bad{color:var(--crit)}
  .who{display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:600; color:var(--ink2);
    background:var(--surface); border:1px solid var(--line2); border-radius:999px; padding:1.5px 10px 1.5px 2px;
    white-space:nowrap}
  .who .wa{width:19px; height:19px; border-radius:50%; display:grid; place-items:center; color:#fff;
    font-family:Archivo; font-size:8.5px; font-weight:700; letter-spacing:.02em; flex:none}
  .who.pc0 .wa{background:var(--ink); color:var(--paper)}
  .who.pc1 .wa{background:var(--pc1)}
  .who.pc2 .wa{background:var(--pc2)}
  .who.pc3 .wa{background:var(--pc3)}
  .who.pc4 .wa{background:var(--pc4)}
  .who.pc5 .wa{background:var(--pc5)}

  .chip{display:inline-flex; align-items:center; gap:5px; padding:2.5px 9px; border-radius:999px;
    font-size:11px; font-weight:600; border:1px solid var(--line2); background:var(--surface); color:var(--ink2); white-space:nowrap}
  .chip.p1{background:var(--crit-soft); border-color:transparent; color:var(--crit)}
  .chip.p2{background:var(--warn-soft); border-color:transparent; color:var(--warn)}
  .chip.p3{background:var(--surface); color:var(--ink2)}
  .chip.nv{background:var(--surface); color:var(--ink3); border-style:dashed}
  .chip.over{background:var(--crit-soft); border-color:transparent; color:var(--crit)}
  .chip.today{background:var(--good-soft); border-color:transparent; color:var(--good)}
  .chip.live{background:var(--surface); color:var(--ink2)}
  .chip.qve{background:var(--surface); color:var(--ink2)}
  .chip.plain{background:transparent}

  .btn{border:1px solid var(--line); background:var(--paper); color:var(--ink); border-radius:7px;
    padding:6px 12px; font-size:13px; font-weight:600; transition:border-color .12s, background .12s}
  .btn:hover{border-color:var(--ink3)}
  .btn.primary{background:var(--brand); border-color:var(--brand); color:var(--brand-ink); box-shadow:0 1px 2px rgba(0,0,0,.14)}
  .btn.primary:hover{filter:brightness(1.05)}
  .btn.sm{padding:4px 9px; font-size:12px}
  .btn.ghost{border-color:transparent; background:transparent; color:var(--ink2)}
  .btn.ghost:hover{background:var(--surface)}
  .btn:disabled{opacity:.5; cursor:not-allowed}

  .field{display:flex; flex-direction:column; gap:4px; min-width:0}
  .field label{font-size:10.5px; text-transform:uppercase; letter-spacing:.09em; color:var(--ink3); font-weight:600}
  input[type=text],input[type=date],input[type=number],select,textarea{
    background:var(--paper); border:1px solid var(--line); border-radius:7px; padding:7px 10px; width:100%;
  }
  input[type=text]:hover,select:hover,textarea:hover,input[type=number]:hover,input[type=date]:hover{border-color:var(--ink3)}
  textarea{resize:vertical; min-height:62px}
  input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,.tick:focus-visible{
    outline:2px solid var(--brand); outline-offset:1px}
  .formgrid{display:grid; gap:10px; grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .formrow{display:flex; gap:8px; flex-wrap:wrap; align-items:flex-end}

  /* tables */
  .tablewrap{overflow-x:auto}
  table{border-collapse:collapse; width:100%; min-width:680px}
  th,td{text-align:left; padding:10px 12px; border-top:1px solid var(--line2); vertical-align:middle}
  th{font-size:10.5px; text-transform:uppercase; letter-spacing:.09em; color:var(--ink3); font-weight:600; border-top:0; white-space:nowrap;
    background:var(--surface)}
  td.n,th.n{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap}
  tbody tr:hover{background:var(--surface)}
  tr.clickable{cursor:pointer}
  .pname{font-weight:600; font-size:13.5px}
  .psub{font-size:11.5px; color:var(--ink3); margin-top:1px}

  .stage{display:flex; flex-direction:column; gap:4px; min-width:120px}
  .stagetxt{font-size:12.5px}
  .track{height:5px; background:var(--bar-track); border-radius:3px; overflow:hidden}
  .track > i{display:block; height:100%; background:var(--bar); border-radius:3px}

  /* charts */
  .barlist{display:flex; flex-direction:column; gap:9px}
  .barrow{display:grid; grid-template-columns:minmax(110px,1.4fr) minmax(90px,3fr) auto; gap:10px; align-items:center}
  .barrow .lbl{font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .barrow .track{height:10px; border-radius:999px}
  .barrow .track > i{border-radius:999px}
  .barrow .amt{font-size:12.5px; font-variant-numeric:tabular-nums; color:var(--ink2); white-space:nowrap; font-weight:500}
  .tcount{margin-left:7px; font-size:10.5px; font-weight:700; background:var(--surface); color:var(--ink2);
    border:1px solid var(--line2); border-radius:999px; padding:1px 6px; font-variant-numeric:tabular-nums}
  nav.tabs button[aria-selected="true"] .tcount{background:var(--paper); border-color:transparent; color:var(--brand)}

  .cols{display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:10px; align-items:end; height:168px}
  .col{display:grid; grid-template-rows:auto 1fr auto; gap:6px; height:100%; justify-items:center; min-width:0}
  .cbar{width:100%; max-width:56px; height:100%; display:flex; align-items:flex-end;
    background:var(--bar-track); border-radius:7px; overflow:hidden}
  .cbar > i{display:block; width:100%; background:var(--bar); opacity:.55; border-radius:7px}
  .col.now .cbar > i{opacity:1}
  .cv{font-size:11px; color:var(--ink2); font-variant-numeric:tabular-nums; white-space:nowrap}
  .cl{font-size:10.5px; color:var(--ink3); text-transform:uppercase; letter-spacing:.07em}

  .filters{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:10px}
  .filters select,.filters input{width:auto; min-width:120px}

  /* drawer */
  .scrim{position:fixed; inset:0; background:rgba(15,15,18,.42); z-index:40; display:none}
  .scrim.open{display:block}
  .drawer{position:fixed; top:0; right:0; height:100%; width:min(520px,100%); background:var(--paper);
    border-left:1px solid var(--line); z-index:50; transform:translateX(100%); transition:transform .18s ease;
    display:flex; flex-direction:column}
  .drawer.open{transform:none}
  .dhead{padding:14px 16px calc(12px); border-bottom:1px solid var(--line); display:flex; gap:10px; align-items:flex-start;
    padding-top:calc(14px + env(safe-area-inset-top,0px))}
  .dhead h3{font-size:16px; font-weight:700}
  .dbody{padding:14px 16px calc(28px + env(safe-area-inset-bottom,0px)); overflow-y:auto; flex:1}
  .dsec{margin-bottom:18px}
  .dsec > h4{font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink3); margin-bottom:8px}
  .logitem{border-top:1px solid var(--line2); padding:9px 0}
  .logitem:first-child{border-top:0}
  .logmeta{font-size:11.5px; color:var(--ink3); display:flex; gap:8px; flex-wrap:wrap}
  @media (prefers-reduced-motion:reduce){.drawer,.person,.btn{transition:none} .person:hover{transform:none}}
  @media (max-width:760px){
    /* header: two compact rows instead of four */
    .topin{padding:8px 12px 0; gap:8px 10px; flex-wrap:wrap}
    .brandtext p{display:none}
    .brandtext h1{font-size:15.5px; white-space:nowrap}
    .mark{width:31px; height:31px; font-size:11px}
    .datechip{display:none}
    .topright{width:100%; margin-left:0; gap:8px; flex-wrap:nowrap; justify-content:space-between;
      padding-bottom:7px}
    #themeBtn{padding:4px 9px; font-size:11.5px; flex:none}
    .nmdlogo.hdr{width:54px; height:19px}
    .whoami{padding:3px 5px 3px 10px; gap:6px; min-width:0; flex:0 1 auto}
    .whoami span{display:none}
    .whoami strong{font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:118px}
    .whoami .btn{flex:none}
    nav.tabs{padding:0 8px 8px}
    nav.tabs button{padding:8px 10px; font-size:12.5px}
    main{padding-left:12px; padding-right:12px; padding-block:16px 60px}

    /* controls: full width, thumb sized */
    .subtabs{width:100%; display:grid; grid-auto-flow:column; grid-auto-columns:1fr}
    .subtabs button{padding:9px 6px; font-size:12.5px; text-align:center}
    .filters{gap:7px}
    .filters select,.filters input{width:100%; min-width:0}
    .blockhead{gap:6px}
    .blockhead > .btn,.blockhead .btn.primary{width:100%}
    .btn.sm{padding:6px 11px; font-size:12.5px}
    .tile .val{font-size:23px}
    .cols{height:150px}

    /* bars read better with the label on its own line */
    .barrow{grid-template-columns:1fr auto; gap:4px 10px}
    .barrow .lbl{grid-column:1 / -1; white-space:normal}
    .barrow .track{grid-column:1}
    .barrow .amt{grid-column:2}

    /* task rows: actions drop to their own line */
    .task{padding:11px 12px; gap:10px; flex-wrap:wrap}
    .taskact{width:100%; justify-content:flex-end; margin-top:2px}
    .tick{width:22px; height:22px}
    .taskgroup{padding:7px 12px}

    /* project rows become compact cards */
    .projtable table{min-width:0}
    .projtable thead{display:none}
    .projtable tbody{display:block; width:100%}
    .projtable tr{display:grid; width:100%; gap:7px 9px; padding:12px; align-items:center;
      grid-template-columns:auto minmax(0,1fr) auto;
      grid-template-areas:"pri proj money" "stage stage stage" "status owner target" "upd upd upd";
      border-top:1px solid var(--line)}
    .projtable tbody tr:first-child{border-top:0}
    .projtable td{display:block; border:0; padding:0; min-width:0}
    .projtable td.n{text-align:left}
    .projtable td[data-l="Priority"]{grid-area:pri}
    .projtable td[data-l="Project"],.projtable td[data-l="Idea"]{grid-area:proj}
    .projtable td[data-l="₹ / month"],.projtable td[data-l="₹ saving"]{grid-area:money; font-weight:700;
      font-size:13.5px; white-space:nowrap}
    .projtable td[data-l="Stage"]{grid-area:stage}
    .projtable td[data-l="Status"]{grid-area:status}
    .projtable td[data-l="Owner"]{grid-area:owner}
    .projtable td[data-l="Target"]{grid-area:target; justify-self:end}
    .projtable td[data-l="Growth"]{display:none}
    .projtable td[data-l="Last update"]{grid-area:upd; border-top:1px dashed var(--line2); padding-top:7px}
    .projtable td[data-l="Last update"] div:first-child{font-size:12px; color:var(--ink2)}
    .projtable td.gcell{display:block; padding:9px 12px}
    .projtable tr.grouprow{display:block; padding:0; grid-template-areas:none}
    .projtable .stage{min-width:0}
    .projtable .pname{font-size:14px}

    /* other tables stay scrollable but hint at it */
    .tablewrap:not(.projtable){-webkit-overflow-scrolling:touch}
    .cardhead{padding:11px 12px}
    .cardbody{padding:12px}
  }
  @media (max-width:400px){
    .projtable tr{gap:6px 7px; padding:11px 10px}
    .projtable td[data-l="Target"]{justify-self:start}
  }

  /* cover / sign in */
  .cover{max-width:980px; margin:0 auto; padding:clamp(18px,4vh,36px) 0 18px; text-align:center; position:relative}

  /* drawing sheet: graph paper, frame, corner ticks, rotating gears */
  .sheet{position:relative; overflow:hidden; border:1px solid var(--line); border-radius:5px;
    padding:clamp(18px,3.5vw,44px);
    background:
      radial-gradient(38% 46% at 34% 34%, var(--glow-1), transparent 72%),
      radial-gradient(30% 40% at 70% 74%, var(--glow-2), transparent 72%),
      radial-gradient(34% 40% at 78% 18%, var(--glow-3), transparent 72%),
      var(--surface)}
  .sheet::before{content:""; position:absolute; inset:0; pointer-events:none;
    background-image:linear-gradient(var(--grid) 1px, transparent 1px),
                     linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size:38px 38px}
  .sheet .tick{position:absolute; width:22px; height:22px; pointer-events:none;
    border:0 solid var(--ink3); opacity:.5}
  .sheet .tick.tl{top:7px; left:7px; border-top-width:1px; border-left-width:1px}
  .sheet .tick.tr{top:7px; right:7px; border-top-width:1px; border-right-width:1px}
  .sheet .tick.bl{bottom:7px; left:7px; border-bottom-width:1px; border-left-width:1px}
  .sheet .tick.br{bottom:7px; right:7px; border-bottom-width:1px; border-right-width:1px}
  .gears{position:absolute; left:calc(50% - 480px); top:-40px; width:660px; max-width:none; aspect-ratio:700/520;

  /* ---------- polish: glass surfaces over the blueprint, motion on view change ---------- */
  body{background:
      radial-gradient(60vw 50vh at 8% -10%, var(--glow-1), transparent 70%) fixed,

  .tick{transition:transform .15s ease, border-color .15s ease, background .15s ease}
  .tick:hover{transform:scale(1.12)}
  .btn{transition:border-color .12s, background .12s, transform .1s ease, box-shadow .15s ease}

  .btn.primary:hover{box-shadow:0 6px 16px -8px var(--brand)}

  /* entrance, only when the view changes (class set by render) */
  @keyframes riseIn{from{opacity:.15; transform:translateY(12px)} to{opacity:1; transform:none}}
  @keyframes growX{from{transform:scaleX(0)} to{transform:none}}
  @keyframes growY{from{transform:scaleY(0)} to{transform:none}}
  @keyframes spinIn{from{transform:rotate(-120deg); opacity:.3} to{transform:none; opacity:1}}
  #view.enter .rise{animation:riseIn .5s cubic-bezier(.2,.8,.2,1) both}
  #view.enter .track > i{transform-origin:left center; animation:growX .9s cubic-bezier(.2,.8,.2,1) .15s both}
  #view.enter .cbar > i{transform-origin:center bottom; animation:growY .9s cubic-bezier(.2,.8,.2,1) .15s both}

  /* ---------- colour: one accent per section, colour-coded content ---------- */
  :root{--sec:var(--brand)}

  /* summary tiles: each its own colour */
  .tiles > .tile{--tc:var(--pc1)}

  .tiles > .tile:nth-child(4n+3){--tc:var(--pc3)}

  /* ---------- motion: finishing a task, opening a panel, messages ---------- */
  @keyframes doneFlash{0%{background:transparent} 35%{background:color-mix(in srgb, var(--good) 22%, transparent)}
    100%{background:color-mix(in srgb, var(--good) 8%, transparent)}}
  @keyframes tickPop{0%{transform:scale(1)} 45%{transform:scale(1.35)} 100%{transform:scale(1)}}
  @keyframes strike{from{background-size:0 2px} to{background-size:100% 2px}}

  /* ---------- cover: engineering drawing sheet ---------- */
  :root{--mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; --dimc:var(--pc2)}

    pointer-events:none; z-index:1}

    font-family:var(--mono); font-size:9px; color:var(--ink3); letter-spacing:.05em}

  /* dimensioned sign-in card */

/* ViewCube */

  transform:rotateX(-30deg) rotateY(-42deg); transition:transform 1s cubic-bezier(.3,.75,.2,1)}

  letter-spacing:.1em; color:var(--chrome-ink); background:color-mix(in srgb, var(--chrome3) 92%, transparent);

body[data-sec="today"] .vcube{transform:rotateX(-16deg) rotateY(-20deg)}

body[data-sec="customers"] .vcube{transform:rotateX(-16deg) rotateY(-70deg)}

body[data-sec="today"] .vcube .fr, body[data-sec="projects"] .vcube .tp, body[data-sec="customers"] .vcube .rt,
body[data-sec="team"] .vcube .lf{background:color-mix(in srgb, var(--sel) 55%, var(--chrome3)); color:#fff}

body[data-sec="projects"] .vcube-lbl::after{content:"Top view"}
body[data-sec="customers"] .vcube-lbl::after{content:"Right view"}

.triad{display:block}

/* ---------- viewport content ---------- */

.cad .crumb{display:flex; align-items:center; gap:10px 14px; flex-wrap:wrap; margin-bottom:16px; padding:8px 12px;
  background:var(--paper); border:1px solid var(--frame); border-radius:3px; box-shadow:var(--shadow);

#view{position:relative}

  background:linear-gradient(90deg, transparent, var(--sel) 20%, var(--sel) 80%, transparent);

  animation:regen .85s cubic-bezier(.4,.1,.3,1) both}
@keyframes regen{0%{transform:translateY(0); opacity:0} 15%{opacity:1} 100%{transform:translateY(70vh); opacity:0}}

/* section heads */

  border:0; padding:0; box-shadow:none; color:var(--ink)}

  border:2px solid var(--sec); background:radial-gradient(circle, var(--sec) 0 2px, transparent 2.5px)}

.cad section.block{margin-bottom:28px}

/* measure readouts */
.cad .tiles{gap:14px; grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
/* work week strip: Sunday → Saturday, Saturday is the weekly off */
.cad .weekstrip{margin-top:14px; background:var(--paper); border:1px solid var(--frame); border-radius:4px; box-shadow:var(--shadow)}
.cad .weekstrip .wshead{display:flex; flex-wrap:wrap; gap:4px 12px; align-items:baseline; padding:10px 14px 8px; border-bottom:1px solid var(--frame-soft)}
.cad .weekstrip .wshead h3{margin:0; font-size:13px; letter-spacing:.08em; text-transform:uppercase}
.cad .weekstrip .wshead span{font-size:12.5px; color:var(--ink2)}
.cad .weekdays{display:grid; grid-template-columns:repeat(7,minmax(0,1fr))}
.cad .wday{padding:9px 10px 10px; border-right:1px solid var(--frame-soft); min-width:0; display:grid; gap:2px}
.cad .wday:last-child{border-right:0}
.cad .wday .wn{font:600 11px/1.2 var(--mono, ui-monospace, monospace); letter-spacing:.08em; text-transform:uppercase; color:var(--ink2)}
.cad .wday .wd{font-size:13px; font-weight:600}
.cad .wday .wc{font-size:11.5px; color:var(--ink2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.cad .wday.is-today{background:color-mix(in srgb, var(--sel) 9%, var(--paper)); box-shadow:inset 0 3px 0 var(--sel)}
.cad .wday.is-today .wn{color:var(--sel)}
.cad .wday.is-off{background:repeating-linear-gradient(135deg, color-mix(in srgb, var(--crit) 7%, var(--paper)) 0 6px, var(--paper) 6px 12px)}
.cad .wday.is-off .wn, .cad .wday.is-off .wc{color:var(--crit); font-weight:700}
@media (max-width:640px){
  .cad .wday{padding:7px 4px; text-align:center}

}
.cad .tile{position:relative; overflow:hidden; background:var(--paper); background-image:none; border:1px solid var(--frame);
  border-radius:3px; padding:14px 16px 26px 18px; box-shadow:inset 3px 0 0 var(--tc), var(--shadow);
  -webkit-backdrop-filter:none; backdrop-filter:none}
.cad .tile:hover{border-color:color-mix(in srgb, var(--tc) 70%, var(--frame)); transform:translateY(-2px);
  box-shadow:inset 3px 0 0 var(--tc), var(--lift)}
.cad .tile::before{content:""; position:absolute; top:12px; right:12px; width:36px; height:36px; background:var(--tc); opacity:.75;
  -webkit-mask:var(--iso) center/contain no-repeat; mask:var(--iso) center/contain no-repeat; transition:transform .5s cubic-bezier(.3,.75,.2,1)}
.cad .tile:hover::before{transform:rotate(-30deg) scale(1.08)}
.cad .tile::after{content:""; position:absolute; left:18px; right:16px; bottom:10px; height:8px; background:var(--tc); opacity:.6;
  -webkit-mask:var(--arl) left center/8px 7px no-repeat, var(--arr) right center/8px 7px no-repeat,
    linear-gradient(#000,#000) center/100% 1px no-repeat, linear-gradient(#000,#000) left center/1px 100% no-repeat, linear-gradient(#000,#000) right center/1px 100% no-repeat;
  mask:var(--arl) left center/8px 7px no-repeat, var(--arr) right center/8px 7px no-repeat,
    linear-gradient(#000,#000) center/100% 1px no-repeat, linear-gradient(#000,#000) left center/1px 100% no-repeat, linear-gradient(#000,#000) right center/1px 100% no-repeat}
.cad #view.enter .tile::after{transform-origin:center; animation:growX .8s cubic-bezier(.2,.8,.2,1) .25s both}
.cad .tile .lab{font-family:var(--mono); font-size:10.5px; font-weight:500; letter-spacing:.12em; text-transform:uppercase; color:var(--ink2); padding-right:40px}
.cad .tile .lab::before{width:7px; height:7px; border-radius:1px; background:var(--tc)}
.cad .tile .val{font-family:var(--cond); font-size:36px; font-weight:700; letter-spacing:.01em; line-height:1.05; margin-top:8px; color:var(--ink)}
.cad .tile.alert .val{color:var(--crit)}
.cad .tile .sub{font-family:var(--mono); font-size:11px; color:var(--ink3); margin-top:4px}

/* drawing views */
.cad #view, .cad .dbody{counter-reset:viewc}
.cad .card{position:relative; background:var(--paper); border:1px solid var(--frame); border-radius:3px; box-shadow:var(--shadow);
  -webkit-backdrop-filter:none; backdrop-filter:none; overflow:visible}
.cad .card::before{content:""; position:absolute; inset:-6px; pointer-events:none; z-index:2; opacity:.9; transition:opacity .2s;
  background:
    linear-gradient(var(--cm),var(--cm)) top left/11px 1px no-repeat, linear-gradient(var(--cm),var(--cm)) top left/1px 11px no-repeat,
    linear-gradient(var(--cm),var(--cm)) top right/11px 1px no-repeat, linear-gradient(var(--cm),var(--cm)) top right/1px 11px no-repeat,
    linear-gradient(var(--cm),var(--cm)) bottom left/11px 1px no-repeat, linear-gradient(var(--cm),var(--cm)) bottom left/1px 11px no-repeat,
    linear-gradient(var(--cm),var(--cm)) bottom right/11px 1px no-repeat, linear-gradient(var(--cm),var(--cm)) bottom right/1px 11px no-repeat}

.cad .card + .card{margin-top:16px}
.cad .cardhead{background:var(--head); border-bottom:1px solid var(--frame); border-radius:3px 3px 0 0; padding:10px 14px; gap:10px}
.cad .cardhead::before{counter-increment:viewc; content:counter(viewc); display:grid; place-items:center; flex:none;
  width:22px; height:22px; border-radius:50%; border:1.5px solid var(--sec); color:var(--sec); background:var(--paper);
  font-family:var(--mono); font-size:10.5px; font-weight:600}

.cad .cardbody{padding:14px}

/* task list */
.cad .taskgroup{background:color-mix(in srgb, var(--gc) 9%, var(--head)); border-top:1px solid var(--frame); border-bottom:1px solid var(--frame-soft);
  font-family:var(--mono); font-size:10.5px; font-weight:500; letter-spacing:.13em; box-shadow:inset 3px 0 0 var(--gc)}

.cad .task{border-top:1px solid var(--frame-soft); padding:12px 14px}

.cad .task:hover .tt{color:var(--sel)}
.cad .task .tt{font-weight:500}
.cad .tick{border-radius:3px; border:1.5px solid var(--frame); background:var(--paper)}
.cad .tick:hover{border-color:var(--sel)}
.cad .task.done .tick, .cad .task.completing .tick{background:var(--good); border-color:var(--good)}

/* chips, people, buttons, inputs */
.cad .chip{border-radius:3px; font-family:var(--mono); font-size:10.5px; font-weight:500; letter-spacing:.02em; padding:2px 7px}
.cad .who{border-radius:3px; font-family:var(--mono); font-weight:500; background:var(--head); border-color:var(--frame-soft)}

.cad .cust-av{border-radius:50%}
.cad .btn{border-radius:4px; border:1px solid var(--frame); background:linear-gradient(180deg, var(--paper), var(--head)); color:var(--ink);
  box-shadow:0 1px 0 rgba(0,0,0,.04)}
.cad .btn:hover{border-color:var(--sel); color:var(--sel)}
.cad .btn.primary{color:var(--brand-ink); border-color:color-mix(in srgb, var(--brand) 75%, #000);
  background:linear-gradient(180deg, color-mix(in srgb, var(--brand) 80%, #fff), var(--brand)); box-shadow:0 6px 14px -9px var(--brand)}

.cad .btn.ghost:hover{background:color-mix(in srgb, var(--sel) 8%, transparent); color:var(--sel)}
.cad main input[type=text], .cad main input[type=date], .cad main input[type=number], .cad main select, .cad main textarea,
.cad .drawer input[type=text], .cad .drawer input[type=date], .cad .drawer input[type=number], .cad .drawer select, .cad .drawer textarea{
  border-radius:3px; border:1px solid var(--frame); background:var(--paper); font-family:var(--mono); font-size:12.5px}

  outline:2px solid var(--sel); outline-offset:1px}
.cad .field label{font-family:var(--mono); font-weight:500; letter-spacing:.12em}

/* sheet tabs for the project lists */
.cad .subtabs{width:100%; max-width:100%; background:transparent; border:0; border-bottom:1.5px solid var(--frame); border-radius:0;
  box-shadow:none; padding:0 0 0 6px; gap:3px; margin-bottom:18px}
.cad .subtabs button{position:relative; border:1px solid var(--frame); border-bottom:0; border-radius:6px 6px 0 0; margin-bottom:-1.5px;
  background:var(--head); color:var(--ink2); padding:8px 18px 9px; font-family:var(--mono); font-size:12px; font-weight:500}
.cad .subtabs button:hover{color:var(--ink); background:var(--paper)}
.cad .subtabs button[aria-selected="true"]{background:var(--paper); color:var(--sc); border-color:var(--frame);
  border-bottom:1.5px solid var(--paper); box-shadow:inset 0 3px 0 var(--sc); font-weight:600}
.cad .subtabs button[data-sub="live"]{--sc:var(--pc2)}
.cad .subtabs button[data-sub="qve"]{--sc:var(--pc4)}

.cad .subtabs button::before{content:""; display:inline-block; width:9px; height:11px; margin-right:8px; vertical-align:-1px;
  border:1.3px solid currentColor; border-radius:1px; clip-path:polygon(0 0, 65% 0, 100% 30%, 100% 100%, 0 100%); opacity:.8}

/* BOM tables */
.cad table{border-collapse:collapse}

/* the director's / head's give-a-task panel: a hatched command panel */

.cad .scrim{background:rgba(10,16,22,.45)}
.cad .toast{border-radius:4px; box-shadow:inset 3px 0 0 var(--hot), var(--lift)}

/* drawing title block */

  grid-template-columns:1.2fr 1.2fr 1.2fr 2fr 1fr .8fr .8fr; box-shadow:var(--shadow)}

/* status bar */
.cad .statusbar{display:flex; position:fixed; left:0; right:0; bottom:0; z-index:26; height:calc(var(--sb-h) + env(safe-area-inset-bottom,0px));

/* ===================== cover in the workspace look =====================
   Same title bar, viewport grid and status bar as the working screens;
   the drawing sheet (frame, zones, gears, balloons, dimensions, title
   block) stays — redrawn as a CAD sheet with a dialog for signing in. */
.cad.signedout .ws{display:block}
.cad.signedout .tree, .cad.signedout .crumb, .cad.signedout .cad-tb{display:none}
.cad.signedout header.top::after{background:linear-gradient(90deg, var(--sel), var(--pc1) 40%, transparent 75%)}
.cad.signedout main{max-width:1240px; padding-block:22px calc(40px + var(--sb-h))}
.cad.signedout .whoami, .cad.signedout #assignBtn, .cad.signedout #bellBtn{display:none !important}
.cad .cover{max-width:1000px}
/* the sheet */
.cad .sheet{border:1px solid var(--frame); border-radius:2px; box-shadow:var(--lift), var(--shadow); overflow:visible;
  background:var(--paper)}
.cad .sheet::before{background-image:linear-gradient(var(--gmin) 1px, transparent 1px), linear-gradient(90deg, var(--gmin) 1px, transparent 1px);
  background-size:20px 20px; inset:14px}
.cad .sheet::after{content:""; position:absolute; inset:-7px; pointer-events:none;
  background:
    linear-gradient(var(--cm),var(--cm)) top left/14px 1px no-repeat, linear-gradient(var(--cm),var(--cm)) top left/1px 14px no-repeat,
    linear-gradient(var(--cm),var(--cm)) top right/14px 1px no-repeat, linear-gradient(var(--cm),var(--cm)) top right/1px 14px no-repeat,
    linear-gradient(var(--cm),var(--cm)) bottom left/14px 1px no-repeat, linear-gradient(var(--cm),var(--cm)) bottom left/1px 14px no-repeat,
    linear-gradient(var(--cm),var(--cm)) bottom right/14px 1px no-repeat, linear-gradient(var(--cm),var(--cm)) bottom right/1px 14px no-repeat}
.cad .sheet .frame{border-color:var(--ink2)}
.cad .zones{color:var(--ink3)}
.cad .zones span{border-color:var(--frame)}
.cad .gears, .cad .detail{color:color-mix(in srgb, var(--sel) 70%, var(--ink2))}
.cad .gears{opacity:.6}
.cad .gears .balloon{color:var(--sel)}
.cad .gears .balloon circle{fill:var(--paper)}
.cad .dim{color:var(--sel)}
.cad .dim-h .dv, .cad .dim-v .dv{background:var(--paper)}
/* the sign-in dialog */
.cad .panel{border-radius:4px; border:1px solid var(--frame); padding:0 26px 24px; overflow:hidden;
  background:color-mix(in srgb, var(--paper) 86%, transparent);
  -webkit-backdrop-filter:blur(10px) saturate(140%); backdrop-filter:blur(10px) saturate(140%);
  box-shadow:0 28px 60px -24px rgba(10,25,40,.55), 0 0 0 1px color-mix(in srgb, var(--sel) 20%, transparent)}
.cad .panel::before{display:none}
.cad .coverhead{flex-direction:row; justify-content:flex-start; gap:16px; text-align:left; margin:0 -26px 18px; padding:16px 26px;
  background:var(--chrome-grad); color:var(--chrome-ink); border-bottom:3px solid var(--sel); position:relative}
.cad .coverhead::after{content:"SIGN IN"; position:absolute; right:16px; top:12px; font-family:var(--mono); font-size:10px; letter-spacing:.16em;
  color:var(--chrome-ink2); border:1px solid var(--chrome-line); border-radius:3px; padding:2px 7px}
.cad .coverhead .nmdlogo.big{width:118px; height:42px; flex:none}
.cad .coverhead h1{font-family:var(--cond); font-size:28px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--chrome-ink)}
.cad .coverhead p{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; color:var(--chrome-ink2); margin-top:3px}
/* stats as measure readouts */
.cad .cover .statstrip{display:grid; grid-template-columns:repeat(auto-fit,minmax(118px,1fr)); gap:10px; border:0; padding:0; margin:0}
.cad .statstrip div{align-items:flex-start; text-align:left; padding:9px 12px 10px; border:1px solid var(--frame); border-radius:3px;
  background:var(--paper); box-shadow:inset 3px 0 0 var(--tc, var(--sel))}
.cad .statstrip div:nth-child(1){--tc:var(--pc1)} .cad .statstrip div:nth-child(2){--tc:var(--pc2)}
.cad .statstrip div:nth-child(3){--tc:var(--pc3)} .cad .statstrip div:nth-child(4){--tc:var(--pc4)}
.cad .statstrip b{font-family:var(--cond); font-size:22px; font-weight:700; letter-spacing:.01em; white-space:nowrap}

.cad .covernote{color:var(--ink2); margin:18px auto 20px}
/* people as tree items */
.cad .people{gap:10px}
.cad .cover .person{display:flex; align-items:center; gap:14px; border-radius:4px; border:1px solid var(--frame); background:var(--paper);
  padding:12px 14px; box-shadow:inset 3px 0 0 transparent; transition:border-color .15s, box-shadow .15s, transform .15s, background .15s}

  box-shadow:inset 3px 0 0 var(--sel), var(--lift); transform:translateY(-1px)}
.cad .cover .person:focus-visible{outline:2px solid var(--sel); outline-offset:2px}
.cad .avatar{border-radius:0; clip-path:var(--gear); width:46px; height:46px;
  font-family:var(--cond); font-weight:700; letter-spacing:.04em}

.cad .pinwrap h2{font-family:var(--cond); text-transform:uppercase; letter-spacing:.04em}
.cad .pinwrap input{font-family:var(--mono); border-radius:3px; border:1px solid var(--frame); background:var(--paper)}
.cad .pinwrap input:focus{border-color:var(--sel); outline:2px solid color-mix(in srgb, var(--sel) 35%, transparent)}
/* title block, matching the working screens */
.cad .tblk{border:1.5px solid var(--ink2); background:var(--paper); -webkit-backdrop-filter:none; backdrop-filter:none; box-shadow:var(--shadow)}

@media (max-width:980px){
  .cad.signedout .statusbar{display:none}
  .cad.signedout main{padding-block:14px 30px}
}

  font:600 11.5px/1.2 var(--mono, ui-monospace, monospace); color:var(--ink2); background:var(--paper)}

<script>
(function(){
  "use strict";

  /* ---------- reference data ---------- */
  var LIVE_STAGES = ["1. Feasibility","2. Design & Costing","3. Quotation Sent","4. Tooling / Fixture",
    "5. Proto Sample","6. Sample Submitted","7. Sample Approved","8. Pilot Lot","9. Production Handover","10. Completed"];
  var QVE_STAGES = ["1. Proposal Pending","2. Proposal Submitted","3. Tooling / Sample in Process","4. Sample Ready",
    "5. Sample Submitted","6. Customer Approval","7. Pilot Lot","8. Implemented"];
  var STATUSES = ["In Progress","Waiting for Customer","Waiting Internal","On Hold","Completed","Dropped"];
  var DEFAULT_TEAM = [
    {id:"kiran", name:"Kiran Pawar", title:"Design Head", role:"2D/3D drawings, costing, approvals"},
    {id:"atharva", name:"Atharva Pathak", title:"Designer", role:"2D/3D drawings, prototype, costing"},
    {id:"prathamesh", name:"Prathamesh Sangamnere", title:"Jr. Designer", role:"2D/3D drawings, costing, BOM"}
  ];
  var HEAD = {id:"head", name:"Manish Teli (Development Head)", title:"Sees every person's work", role:"Design & Development head"};
  var OWNER = {id:"owner", name:"MAYUR MUNDRA (DIRECTOR)", title:"Director · full access", role:"Every task, every report"};
  /* the head and the owner both see the whole team's work and can give out tasks */
  function isLead(id){ return id === "head" || id === "owner"; }
  function postOf(m){ return (m && m.title) ? m.title : ((m && m.role) || ""); }
  var TEAM_ADMIN = "atharva";              // only this person can change the team list
  function teamAdminId(){ return state.teamAdmin || TEAM_ADMIN; }
  function canEditTeam(){ return !!state.auth && (state.who === teamAdminId() || state.who === "owner"); }
  var CAPACITY = 5; // tasks the morning plan gives one person

  var REASONS = ["Customer reply / approval pending","Drawing or data not received","Material / RM not available",
    "Vendor delay","Tool / fixture not ready","Machine not available","Manpower short / pulled to other work",
    "Quality issue / rework","Costing or BOM input pending","Not enough time — planned too much","Project on hold","Other"];
  var HOLD_REASON = "Project on hold";
  var APP_VERSION = "28 Oct 2026 · task with from project list";

  var STEP = {
    live:{"1. Feasibility":"Check feasibility and list the open questions",
      "2. Design & Costing":"Finish 2D/3D drawing and costing",
      "3. Quotation Sent":"Follow up the quotation with the customer",
      "4. Tooling / Fixture":"Finish the fixture / tool and take a trial",
      "5. Proto Sample":"Make the proto sample and its inspection report",
      "6. Sample Submitted":"Follow up the sample approval with the customer",
      "7. Sample Approved":"Plan the pilot lot with production",
      "8. Pilot Lot":"Run the pilot lot and record the observations",
      "9. Production Handover":"Hand over drawings and documents to production"},
    qve:{"1. Proposal Pending":"Prepare the proposal with the saving calculation",
      "2. Proposal Submitted":"Follow up the proposal with the customer",
      "3. Tooling / Sample in Process":"Finish the tooling / sample work",
      "4. Sample Ready":"Submit the sample to the customer",
      "5. Sample Submitted":"Follow up the sample approval",
      "6. Customer Approval":"Follow up the customer approval",
      "7. Pilot Lot":"Run the pilot lot and confirm the result"}
  };
  function nextStep(p){
    var cur = currentPStep(p);
    if(cur) return stepTaskTitle(cur);
    if(p.nextAction) return p.nextAction;
    var m = STEP[p.type === "qve" ? "qve" : "live"];
    return m[p.stage] || ("Decide the next step (" + (p.stage || "stage not set") + ")");
  }

  /* ---------- project process flow (PROJECTS PROCESS FLOW.xlsx) ----------
     d = days allowed for the step (null = depends on the customer / production).
     q = Yes / No question asked before the step. skipOn = the answer that makes
     the step unnecessary. closeOn = the answer that closes the enquiry. */
  var LIVE_FLOW = [
    {k:"1",   t:"Demand the missing data from the customer", d:1, s:"1. Feasibility"},
    {k:"2",   t:"Feasibility study", d:1, s:"1. Feasibility"},
    {k:"3",   t:"Make the BO and Fab BOM", d:2, s:"2. Design & Costing"},
    {k:"4",   t:"Send the BO BOM to purchase for rates", d:1, s:"2. Design & Costing"},
    {k:"5",   t:"Review the costing with Manish sir", d:1, s:"2. Design & Costing"},
    {k:"6",   t:"Make the changes in the BOM", d:1, s:"2. Design & Costing", q:"BOM changes required?", skipOn:"no"},
    {k:"7",   t:"Send the quotation to the customer", d:1, s:"3. Quotation Sent"},
    {k:"8",   t:"Follow up with the customer for the order", d:null, s:"3. Quotation Sent", note:"depends on the customer's reply"},
    {k:"9",   t:"Make the drawings", d:2, s:"3. Quotation Sent", q:"Approved?", closeOn:"no"},
    {k:"10a", t:"Check bought-out availability and follow up the purchase dept", d:0.5, s:"5. Proto Sample"},
    {k:"10b", t:"Prepare the manufacturing drawings (drafting)", d:0.5, s:"5. Proto Sample", q:"Drawings given by the customer?", skipOn:"yes"},
    {k:"10c", t:"Release the blank drawings for laser and turret", d:0.5, s:"5. Proto Sample"},
    {k:"10d", t:"Make the temporary tool and fixture for the sample", d:0.5, s:"5. Proto Sample", q:"Tool / fixture required?", skipOn:"no"},
    {k:"10e", t:"Complete the fabrication operations (press, bending and welding)", d:2, s:"5. Proto Sample"},
    {k:"10f", t:"Special processing of the sample", d:2, s:"5. Proto Sample", q:"Special processing required?", skipOn:"no"},
    {k:"10g", t:"Final assembly of the sample", d:0.5, s:"5. Proto Sample"},
    {k:"10h", t:"Offer the sample to PDI for checking as per GA and BOM", d:0.5, s:"5. Proto Sample"},
    {k:"10i", t:"Make the process flow of the part", d:1, s:"5. Proto Sample"},
    {k:"11",  t:"Send the proto sample for approval", d:1, s:"6. Sample Submitted", note:"approval time depends on the customer"},
    {k:"12",  t:"Make the changes in the drawing after the proto sample", d:1, s:"7. Sample Approved", q:"Drawing changes required?", skipOn:"no"},
    {k:"13",  t:"Share the final BOM with purchase for BO planning", d:0.5, s:"7. Sample Approved"},
    {k:"14",  t:"Release the drawing and process flow to production", d:0.5, s:"7. Sample Approved"},
    {k:"15",  t:"Finalize the fixtures and tools", d:1, s:"7. Sample Approved", q:"Fixtures / tools required?", skipOn:"no"},
    {k:"16",  t:"Make the pilot lot for our process review", d:null, s:"8. Pilot Lot", note:"depends on the production schedule and part complexity"},
    {k:"17",  t:"Change the process flow and manufacturing drawing after the pilot lot", d:1, s:"9. Production Handover", q:"Changes required after the pilot lot?", skipOn:"no"}
  ];
  var QVE_FLOW = [
    {k:"1", t:"Make the presentation (before and after)", d:1, s:"1. Proposal Pending"},
    {k:"2", t:"Calculate and present the cost difference", d:2, s:"1. Proposal Pending"},
    {k:"3", t:"Make the proto sample", d:null, s:"3. Tooling / Sample in Process", note:"depends on the change"},
    {k:"4", t:"Present the sample and PPT to the customer", d:1, s:"4. Sample Ready"},
    {k:"5", t:"Get the revised drawings from the customer", d:null, s:"6. Customer Approval", q:"Own drawings to be made?", note:"depends on the customer"},
    {k:"6", t:"Implement on the product", d:null, s:"7. Pilot Lot", note:"depends on the change"}
  ];
  /* where an existing project starts on the ladder, from its current stage number */
  var LIVE_START = {"":"1","1":"1","2":"3","3":"8","4":"10d","5":"10a","6":"11","7":"12","8":"16","9":"17"};
  var QVE_START  = {"":"1","1":"1","2":"3","3":"3","4":"4","5":"4","6":"5","7":"6"};
  function flowOf(p){ return p.type === "qve" ? QVE_FLOW : LIVE_FLOW; }
  function stageNo(s){ var m = /^(\d+)\./.exec(s || ""); return m ? m[1] : ""; }
  function hasSteps(p){ return !!(p && p.steps && p.steps.length); }
  function currentPStep(p){
    if(!hasSteps(p) || !isActive(p) || isOnHold(p)) return null;
    for(var i = 0; i < p.steps.length; i++){ if(p.steps[i].status === "open") return p.steps[i]; }
    return null;
  }
  function projStepPct(p){
    var l = p.steps || []; if(!l.length) return 0;
    return Math.round(l.filter(function(x){ return x.status !== "open"; }).length / l.length * 100);
  }
  function projPct(p){ return hasSteps(p) ? projStepPct(p) : stagePct(p); }
  function daysLabel(d){
    if(d == null) return "depends";
    if(d === 0.5) return "½ day";
    return d + (d === 1 ? " day" : " days");
  }
  function decisionHint(st){
    if(st.closeOn) return (st.closeOn === "no" ? "No" : "Yes") + " closes the enquiry";
    if(st.skipOn) return (st.skipOn === "no" ? "No" : "Yes") + " skips this step";
    return "Either answer keeps the step";
  }
  function stepTaskTitle(st){
    if(st.q && !st.answer) return "Step " + st.k + ": " + st.q + " (Yes / No) → " + st.title;
    return "Step " + st.k + ": " + st.title;
  }
  function addDaysF(isoDate, n){ return addWork(isoDate || today(), n); }
  /* planned dates run on from `from`; a step with no fixed time stops the chain
     until it is finished, then the rest are planned from that day */
  function planSteps(steps, from){
    var base = from || today(), cum = 0, stop = false;
    steps.forEach(function(st){
      if(st.status !== "open") return;
      if(stop || st.days == null){ st.plan = ""; stop = true; return; }
      cum += st.days; st.plan = addDaysF(base, cum);
    });
    return steps;
  }
  function buildProjectSteps(p){
    var finished = p.status === "Completed";
    var startKey = (p.type === "qve" ? QVE_START : LIVE_START)[stageNo(p.stage)];
    var reached = false;
    var steps = flowOf(p).map(function(f, i){
      if(!finished && f.k === startKey) reached = true;
      var st = {n:i + 1, k:f.k, title:f.t, days:f.d, stage:f.s, status:"open", doneAt:"", plan:"", answer:""};
      if(f.q){ st.q = f.q; st.skipOn = f.skipOn || ""; st.closeOn = f.closeOn || ""; }
      if(f.note) st.note = f.note;
      if(!reached){ st.status = "done"; st.carried = true; }
      return st;
    });
    return planSteps(steps, today());
  }
  function pStepDelay(st){
    if(st.carried || (st.status !== "done" && st.status !== "open")) return null;
    return stepDelay(st);
  }
  function stepActor(p){ return isLead(state.who) ? (p.owner || state.who) : state.who; }
  function commitSteps(p, steps, logText, extra){
    var patch = Object.assign({steps:steps}, extra || {});
    var cur = null;
    for(var i = 0; i < steps.length; i++){ if(steps[i].status === "open"){ cur = steps[i]; break; } }
    var list = stagesFor(p.type);
    if(patch.status !== "Dropped"){
      if(!cur){
        patch.stage = list[list.length - 1]; patch.status = "Completed";
        if(!p.completedOn) patch.completedOn = today();
      } else if(list.indexOf(cur.stage) > list.indexOf(patch.stage || p.stage)) patch.stage = cur.stage;
    }
    if(logText){
      var lg = (p.log || []).map(function(x){ return Object.assign({}, x); });
      lg.unshift({d:today(), by:stepActor(p), t:logText, stage:patch.stage || p.stage || "", status:patch.status || p.status || ""});
      patch.log = lg.slice(0, 40);
    }
    return saveProject(p, patch);
  }
  /* how: "done" for a normal step, "yes" / "no" to answer a step's question */
  function completeStep(p, k, how){
    if(!hasSteps(p)) return;
    var steps = p.steps.map(function(x){ return Object.assign({}, x); });
    var st = steps.filter(function(x){ return x.k === k; })[0];
    if(!st || st.status !== "open") return;
    var text = "", extra = null, closed = false;
    if(how === "yes" || how === "no"){
      st.answer = how;
      var said = st.q + " " + (how === "yes" ? "Yes" : "No");
      if(st.closeOn && st.closeOn === how){
        st.status = "closed"; st.doneAt = today(); st.plan = st.plan || "";
        steps.forEach(function(x){ if(x.n > st.n && x.status === "open"){ x.status = "skipped"; x.byClose = true; x.plan = ""; } });
        text = "Step " + st.k + " — " + said + ". Enquiry closed.";
        extra = {status:"Dropped"}; closed = true;
      } else if(st.skipOn && st.skipOn === how){
        st.status = "skipped"; st.doneAt = today();
        text = "Step " + st.k + " — " + said + ", so this step is not needed: " + st.title;
      } else {
        text = "Step " + st.k + " — " + said;
      }
    } else {
      st.status = "done"; st.doneAt = today();
      text = "Step " + st.k + " done — " + st.title;
    }
    if(st.status !== "open" && !closed) planSteps(steps, today());
    commitSteps(p, steps, text, extra);
    var now = new Date().toISOString();
    var linked = state.tasks.filter(function(t){ return t.projectId === p.id && t.pStep && t.status !== "done"; });
    if(st.status === "open"){
      linked.filter(function(t){ return t.pStep === st.k; })
        .forEach(function(t){ saveTask(t, {title:stepTaskTitle(st)}); });
      return;
    }
    linked.filter(function(t){ return closed || t.pStep === st.k; })
      .forEach(function(t){ saveTask(t, {status:"done", doneAt:now}); });
    if(!closed) openPStepTask(p);
  }
  function reopenStep(p, k){
    if(!hasSteps(p)) return;
    var steps = p.steps.map(function(x){ return Object.assign({}, x); });
    var st = steps.filter(function(x){ return x.k === k; })[0];
    if(!st || st.status === "open") return;
    var wasClose = st.status === "closed";
    st.status = "open"; st.doneAt = ""; st.answer = ""; delete st.carried;
    if(wasClose) steps.forEach(function(x){ if(x.byClose){ x.status = "open"; delete x.byClose; } });
    planSteps(steps, today());
    var extra = null;
    if(p.status === "Completed" || p.status === "Dropped"){
      var first = steps.filter(function(x){ return x.status === "open"; })[0];
      extra = {status:"In Progress", completedOn:"", stage:first ? first.stage : p.stage};
    }
    commitSteps(p, steps, "Step " + st.k + " reopened — " + st.title, extra);
    openPStepTask(p);
  }
  function openPStepTask(p){
    var st = currentPStep(p);
    if(!st) return null;
    var already = state.tasks.filter(function(t){
      return t.projectId === p.id && t.status !== "done" && t.pStep === st.k;
    })[0];
    if(already) return already;
    var t = makeTask(p, stepAssignee(p, st));
    saveTask(t);
    return t;
  }
  /* ---------- sharing the process steps across the whole team ---------- */
  function openLoad(id){
    return state.tasks.filter(function(t){ return t.assignee === id && t.status !== "done"; }).length;
  }
  function hashStr(s){ var h = 0; for(var i = 0; i < s.length; i++){ h = (h * 31 + s.charCodeAt(i)) >>> 0; } return h; }
  /* the person with the fewest open tasks; a tie is broken by the project and
     step so equal loads still spread across people */
  /* customer follow-up work belongs to Manish sir (the development head);
     the follow-up for missing data (CAD / GAD / BOM) stays with the team */
  function isMissingDataFollowUp(title){
    title = String(title || "");

    function fail(msg){ err.textContent = msg; p1.value = ""; if(!stored) p2.value = ""; p1.focus(); }
    function submit(){
      var v = (p1.value || "").trim();
      if(!/^\d{4,6}$/.test(v)) return fail("The PIN must be 4 to 6 digits.");
      if(stored){
        pinHash(id, v).then(function(h){
          if(h === stored) signIn(id);
          else fail("That PIN is not right.");
        });
      } else {
        if(v !== (p2.value || "").trim()) return fail("The two PINs do not match.");

          state.pins[id] = h;

    p2.addEventListener("keydown", function(e){ if(e.key === "Enter") submit(); });
    box.appendChild(el("div",{style:"margin-top:16px;display:flex;gap:8px;justify-content:center"},[
      el("button",{class:"btn primary", onclick:submit},[stored ? "Enter" : "Set PIN and enter"]),

  function waitForClaude(cb, tries){
    tries = tries || 0;
    if(window.claude && typeof window.claude.use === "function") return cb(window.claude);
    if(tries > 75) return cb(null);                       /* ~15 seconds */
    setTimeout(function(){ waitForClaude(cb, tries + 1); }, 200);
  }
  function connect(){
    if(state.db) return;
    banner("Connecting to your saved data…");
    waitForClaude(function(c){
      if(!c){
        state.ready = true; state.pinsLoaded = true; render();
        banner("Not connected to the saved data. Open the dashboard in its own window (not the small preview) and try again.",
               "Try again", connect);
        return;
      }
      c.use("permissions").then(function(perm){
        if(perm && perm.request) return perm.request(["db"]).catch(function(){});
      }).catch(function(){}).then(function(){ openStore(c); });
    });
  }
  function openStore(c){
    state.diag.claude = true;
    c.use("db").then(function(db){
      if(!db){
        state.ready = true; state.pinsLoaded = true; state.diag.err = "db not granted"; render();
        banner("This view is not allowed to read the saved projects. Reload the page and accept the data prompt.",
               "Try again", function(){ state.db = null; openStore(c); });
        return;
      }
      state.db = db;
      state.diag.store = true;
      probeWrite(db);
      loadOnce(db);
      subscribe(db);
    }).catch(function(e){
      state.ready = true; state.pinsLoaded = true; state.diag.err = errText(e); render();
      banner("Could not open the saved data (" + state.diag.err + "). Reload the page and accept the data prompt.",
             "Try again", function(){ state.db = null; openStore(c); });
    });
  }

               " to give your account Contributor access from the Share menu.");
      }
      render();
    });
  }

  /* ---------- special DBs (Legrand customised) ---------- */
  var SD_NEW_STEPS = [
    {t:"Take follow-up of customer for missing data (CAD / GAD / BOM)", who:"atharva", onlyIfMissing:true, days:3},
    {t:"Make costing from BOM and drawings and share with Manish sir", who:"prathamesh", days:2},
    {t:"Clear drawings — check and correct every dimension in the customer CAD", who:"atharva", days:3},
    {t:"Release sample parts to laser cutting and turret punching", who:"atharva", days:1},
    {t:"Complete bending of the sample", who:"atharva", days:2},
    {t:"Welding and fitment check of the sample", who:"atharva", days:2},
    {t:"Hooking and powder coating of the sample", who:"atharva", days:2},
    {t:"Assemble the sample as per customer GAD and BOM", who:"atharva", days:1},
    {t:"Make the DB file — job card, process flow, GAD, BOM, part drawings", who:"prathamesh", days:3},
    {t:"Hand over the file to production and purchase", who:"prathamesh", days:1}
  ];
  var SD_REPEAT_STEPS = [
    {t:"Update the job card in the DB file (change process flow / BOM / drawings if required)", who:"prathamesh", days:2},
    {t:"Submit the updated file to the purchase team", who:"prathamesh", days:1}
  ];
  function addDays(s, n){ return addWork(s || today(), n); }    /* working days — Saturday is off */
  function isoOf(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function planDays(kind){
    var cfg = state.sdplan || {};
    var tpl = kind === "new" ? SD_NEW_STEPS : SD_REPEAT_STEPS;
    var saved = kind === "new" ? cfg.newDays : cfg.repeatDays;
    return tpl.map(function(st, i){
      return (saved && saved[i] != null) ? +saved[i] : st.days;
    });
  }
  /* planned date of a step = start date + the lead times up to that step */
  function stepDelay(st){
    if(!st.plan) return null;
    if(st.doneAt) return dayDiff(st.doneAt, st.plan);
    var late = dayDiff(today(), st.plan);
    return late > 0 ? late : 0;
  }
  function latestOrderMonth(){
    var ms = state.sdbs.map(function(x){ return x.month; }).concat(state.sdorders.map(function(x){ return x.id; })).filter(Boolean).sort();
    return ms.length ? ms[ms.length - 1] : "";
  }
  function sdMonth(){ return state.sdMonth || latestOrderMonth() || shiftMonth(0); }
  function sdKey(code){ return String(code == null ? "" : code).toUpperCase().replace(/[^A-Z0-9]/g, ""); }
  function sdById(id){ return state.sdbs.filter(function(x){ return x.id === id; })[0]; }
  function sdDocId(month, code){ return month + "_" + String(code).replace(/[^A-Za-z0-9_.~:@+-]/g, "-").slice(0, 60); }
  function avail(v){
    var x = (v == null ? "" : String(v)).trim().toUpperCase();
    if(!x || x === "NA" || x === "N/A" || x === "-") return "NA";
    if(x.indexOf("NOT") === 0) return "NOT AVAILABLE";
    if(x.indexOf("AVAIL") >= 0 || x === "YES" || x === "OK" || x === "DONE") return "AVAILABLE";
    return x;
  }
  /* For a new DB anything not marked AVAILABLE still has to come from the
     customer, blank included. For a repeat DB only an explicit NOT AVAILABLE
     is a gap, since these columns are normally left as NA. */
  function sdMissing(sd){
    var out = [];
    var labels = {cad:"CAD", gad:"GAD", bom:"BOM"};
    ["cad","gad","bom"].forEach(function(k){
      var v = sd[k] || "NA";
      if(sd.kind === "new" ? v !== "AVAILABLE" : v === "NOT AVAILABLE") out.push(labels[k]);
    });
    return out;
  }
  function buildSteps(sd, keep){
    var tpl = sd.kind === "new" ? SD_NEW_STEPS : SD_REPEAT_STEPS;
    var days = planDays(sd.kind);
    var miss = sdMissing(sd);
    var start = sd.startDate || sd.createdAt || today();
    var steps = [];
    var cursor = start;
    tpl.forEach(function(st, i){
      if(st.onlyIfMissing && !miss.length) return;
      var title = st.t + (st.onlyIfMissing && miss.length ? " — " + miss.join(", ") : "");
      cursor = addDays(cursor, days[i]);
      var old = keep ? (keep.filter(function(x){ return x.n === steps.length + 1; })[0] || {}) : {};
      steps.push({n:steps.length + 1, title:title + " — " + sd.sdCode, who:st.who,
                  status:old.status || "open", doneAt:old.doneAt || "", taskId:old.taskId || "",
                  plan:old.plan || cursor});
    });
    return steps;
  }
  function currentStep(sd){
    var list = sd.steps || [];
    for(var i = 0; i < list.length; i++){ if(list[i].status !== "done") return list[i]; }
    return null;
  }
  function sdProgress(sd){
    var list = sd.steps || [];
    if(!list.length) return 0;
    var done = list.filter(function(x){ return x.status === "done"; }).length;
    return Math.round(done / list.length * 100);
  }
  function saveSd(sd, patch){
    if(patch) Object.keys(patch).forEach(function(k){ sd[k] = patch[k]; });
    var i = -1; state.sdbs.forEach(function(x, k){ if(x.id === sd.id) i = k; });
    if(i < 0) state.sdbs.push(sd);
    var body = {}; Object.keys(sd).forEach(function(k){ if(k.charAt(0) !== "_") body[k] = sd[k]; });
    render();
    if(state.db) return state.db.doc("sdbs/" + sd.id).set(body).catch(onWriteErr);
    return Promise.resolve();
  }
  function makeSdTask(sd, step){
    return {id:uid("T"), projectId:"", sdId:sd.id, sdStep:step.n, sdCode:sd.sdCode,
            title:step.title, assignee:isCustFollowUp(step.title) ? "head" : (onLeave(step.who) ? (lightestPresent(step.who) || step.who) : step.who), date:workDay(step.plan || today()),
            plannedDate:step.plan ? workDay(step.plan) : "", firstDate:workDay(step.plan || today()), status:"open",
            createdAt:new Date().toISOString(), note:""};
  }
  function openStepTask(sd){
    var step = currentStep(sd);
    if(!step) return null;
    var already = state.tasks.filter(function(t){
      return t.sdId === sd.id && t.sdStep === step.n && t.status !== "done";
    })[0];
    if(already) return already;
    var t = makeSdTask(sd, step);
    saveTask(t);
    var steps = (sd.steps || []).map(function(x){ return Object.assign({}, x); });
    steps.forEach(function(x){ if(x.n === step.n) x.taskId = t.id; });
    saveSd(sd, {steps:steps});
    return t;
  }
  /* a finished special-DB task moves that DB to its next step */
  function sdStepDone(t){
    var sd = sdById(t.sdId);
    if(!sd || !taskOfThisOrder(sd, t)) return;
    var steps = (sd.steps || []).map(function(x){ return Object.assign({}, x); });
    var found = false;
    steps.forEach(function(x){
      if(x.n === t.sdStep && x.status !== "done"){ x.status = "done"; x.doneAt = today(); x.doneBy = t.assignee || state.who; found = true; }
    });
    if(!found) return;
    sd.steps = steps;
    saveSd(sd, Object.assign({steps:steps}, isFollowUpStep(sd, t.sdStep) ? dataReceivedPatch(sd) : {}));
    var next = currentStep(sd);
    if(next) saveTask(makeSdTask(sd, next));
  }
  /* the "follow up the customer for missing data" step: once it is done the
     customer data (CAD / GA drawing / BOM) counts as received */
  function isFollowUpStep(sd, n){
    var st = (sd.steps || []).filter(function(x){ return x.n === n; })[0];
    return !!st && /^Take follow-up of customer for missing data/i.test(st.title || "");
  }
  function dataReceivedPatch(sd){
    var p = {};
    ["cad","gad","bom"].forEach(function(k){ if(avail(sd[k]) !== "AVAILABLE") p[k] = "AVAILABLE"; });
    return p;
  }
  /* repair on load: a step whose task was finished counts as done, and a
     finished follow-up step means the customer data is complete */
  /* a task belongs to this order of the DB only if it was made after the order
     was loaded — tasks from an earlier order of the same SD code never tick it */
  function taskOfThisOrder(sd, t){
    var start = sd.startedAt || sd.startDate || sd.createdAt || "";
    if(!start) return true;
    return String(t.createdAt || "") >= (start.length > 10 ? start : start + "T00:00:00");
  }
  /* the same SD code twice in one month: keep one (the one with more work done,
     else the newer), add the quantities if both came from the same file */
  function dedupeSdbs(){
    var groups = {};
    state.sdbs.forEach(function(sd){ var k = sd.month + "|" + sdKey(sd.sdCode); (groups[k] = groups[k] || []).push(sd); });
    var removed = 0, tasksAll = state.allTasks || state.tasks;
    Object.keys(groups).forEach(function(k){
      var g = groups[k]; if(g.length < 2) return;
      g.sort(function(a, b){ return sdProgress(b) - sdProgress(a) || String(b.startedAt || b.createdAt || "").localeCompare(String(a.startedAt || a.createdAt || "")); });
      var keep = g[0], add = {orderQty:+keep.orderQty || 0, pendingQty:+keep.pendingQty || 0, lines:+keep.lines || 1};
      g.slice(1).forEach(function(d){
        if(String(d.createdAt || "") === String(keep.createdAt || "")){
          add.orderQty += +d.orderQty || 0; add.pendingQty += +d.pendingQty || 0; add.lines += +d.lines || 1;
        }
        tasksAll.filter(function(t){ return t.sdId === d.id && t.status !== "done"; }).forEach(function(t){ removeTask(t); });
        tasksAll.filter(function(t){ return t.sdId === d.id && t.status === "done"; }).forEach(function(t){ saveTask(t, {sdId:keep.id}); });
        deleteSd(d); removed++;
      });
      saveSd(keep, add);
    });
    return removed;
  }
  function reconcileSdbs(){
    if(state.sdChecked || !state.db || !state.canWrite || !state.sdbs.length) return;
    state.sdChecked = true;
    try { dedupeSdbs(); } catch(e){}
    state.sdbs.forEach(function(sd){
      var steps = (sd.steps || []).map(function(x){ return Object.assign({}, x); });
      var changed = false, start = String(sd.startDate || sd.createdAt || "").slice(0,10);
      steps.forEach(function(x){
        /* undo a tick that came from an earlier order: done before this order started, by nobody */
        if(x.status === "done" && !x.doneBy && x.doneAt && start && String(x.doneAt).slice(0,10) < start){
          x.status = "open"; x.doneAt = ""; changed = true; return;
        }
        if(x.status === "done") return;
        var doneTask = state.tasks.filter(function(t){ return t.sdId === sd.id && t.sdStep === x.n && t.status === "done" && taskOfThisOrder(sd, t); })[0];
        if(doneTask){ x.status = "done"; x.doneAt = (doneTask.doneAt || "").slice(0,10) || today(); x.doneBy = doneTask.assignee || ""; changed = true; }
      });
      var tmp = Object.assign({}, sd, {steps:steps});
      var fu = steps.filter(function(x){ return isFollowUpStep(tmp, x.n) && x.status === "done"; })[0];
      var dataPatch = fu ? dataReceivedPatch(sd) : {};
      if(!changed && !Object.keys(dataPatch).length) return;
      saveSd(sd, Object.assign(changed ? {steps:steps} : {}, dataPatch));
      if(changed){ var nx = currentStep(sd); if(nx) openStepTask(sd); }
    });
  }

  /* read the monthly order workbook the customer schedule is prepared in */
  function parseSdWorkbook(buf){
    var wb = XLSX.read(buf, {type:"array"});
    var ws = wb.Sheets[wb.SheetNames[0]];
    var rows = XLSX.utils.sheet_to_json(ws, {header:1, blankrows:false, defval:""});
    var head = -1, map = {};
    function norm(v){ return String(v == null ? "" : v).replace(/\u00a0/g, " ").trim().toLowerCase(); }
    for(var r = 0; r < Math.min(rows.length, 30); r++){
      var cells = rows[r].map(norm);
      if(cells.some(function(c){ return c.replace(/\s+/g, "") === "sdcode"; })){ head = r; break; }
    }
    if(head < 0) return {error:"Could not find a 'SD CODE' heading in the first sheet."};
    rows[head].forEach(function(h, i){
      var k = norm(h).replace(/\s+/g, " ");
      if(k.indexOf("sd code") >= 0) map.code = i;
      else if(k.indexOf("description") >= 0) map.desc = i;
      else if(k.indexOf("critical") >= 0) map.critical = i;
      else if(k.indexOf("pending") >= 0 || k.indexOf("pend") === 0 || k.indexOf("balance") >= 0 || k.indexOf("bal qty") >= 0) map.pend = i;
      else if(k.indexOf("order qty") >= 0 || k.indexOf("ord qty") >= 0 || (map.qty == null && /\bqty\b|quantity/.test(k))) map.qty = i;
      else if(k.indexOf("sfg item") >= 0) map.sfgItem = i;
      else if(k.indexOf("communication") >= 0) map.comm = i;
      else if(k.indexOf("po no") >= 0 || k === "po") map.po = i;
      else if(k.indexOf("new db") >= 0) map.newdb = i;
      else if(k.indexOf("cad") >= 0) map.cad = i;
      else if(k.indexOf("ga drawing") >= 0 || k.indexOf("gad") >= 0) map.gad = i;
      else if(k === "bom" || k.indexOf("bom") >= 0) map.bom = i;
      else if(k.indexOf("sfg code") >= 0) map.sfgCode = i;
      else if(k.indexOf("remark") >= 0) map.remark = i;
    });
    if(map.code == null) return {error:"The SD CODE column could not be read."};
    /* How the sheet marks a new DB: when any row carries a cell that reads
       exactly "New" (the marker column at the end, usually highlighted), that
       marker decides. The "NEW DB" column is used only when no such marker
       exists anywhere in the file, because it is not always cleared on repeats. */
    var marked = function(row){ return row.some(function(c){ return norm(c) === "new"; }); };
    var hasMarker = false;
    for(var j = head + 1; j < rows.length; j++){ if(marked(rows[j])){ hasMarker = true; break; } }

    var byCode = {}, order = [];
    for(var i = head + 1; i < rows.length; i++){
      var row = rows[i];
      var code = String(row[map.code] == null ? "" : row[map.code]).replace(/\u00a0/g, " ").trim();
      if(!code) continue;
      if(norm(code) === "sd code" || norm(code).indexOf("total") === 0) continue;
      var isNew = hasMarker ? marked(row)
                            : (map.newdb != null && norm(row[map.newdb]).indexOf("yes") >= 0);
      var key = sdKey(code);
      var item = byCode[key];
      if(!item){
        item = {sdCode:code,
                desc:String(row[map.desc] == null ? "" : row[map.desc]).replace(/\u00a0/g, " ").trim(),
                kind: isNew ? "new" : "repeat",
                critical: map.critical != null && norm(row[map.critical]).indexOf("critical") >= 0,
                orderQty: 0, pendingQty: 0, lines: 0, poNos: [],
                sfgItem: map.sfgItem == null ? "" : String(row[map.sfgItem] || "").trim(),
                commDate: map.comm == null ? "" : String(row[map.comm] || "").trim(),
                cad: avail(map.cad == null ? "" : row[map.cad]),
                gad: avail(map.gad == null ? "" : row[map.gad]),
                bom: avail(map.bom == null ? "" : row[map.bom]),
                sfgCode: avail(map.sfgCode == null ? "" : row[map.sfgCode]),
                remarks: map.remark == null ? "" : String(row[map.remark] || "").trim()};
        byCode[key] = item; order.push(key);
      }
      if(isNew) item.kind = "new";
      var num = function(v){ return +String(v == null ? "" : v).replace(/[, ]/g, "") || 0; };
      item.orderQty += (map.qty == null ? 0 : num(row[map.qty]));
      item.pendingQty += (map.pend == null ? num(row[map.qty]) : num(row[map.pend]));   /* no pending column: whole order is pending */
      if(item.lines && !item.desc) item.desc = String(row[map.desc] == null ? "" : row[map.desc]).trim();
      item.lines++;
      var po = map.po == null ? "" : String(row[map.po] || "").trim();
      if(po && item.poNos.indexOf(po) < 0) item.poNos.push(po);
    }
    return {items: order.map(function(c){ return byCode[c]; })};
  }

  /* ---------- automatic allocation, morning plan, end of day ---------- */
  function openCount(pid){
    return state.tasks.filter(function(t){ return t.projectId === pid && t.status !== "done"; }).length;
  }
  function loadOf(id){
    return state.projects.filter(function(p){ return isActive(p) && p.owner === id; }).length;
  }
  function lightestMember(){
    var best = null, bestLoad = 1e9;
    presentTeam().forEach(function(m){
      var l = loadOf(m.id);
      if(l < bestLoad){ bestLoad = l; best = m.id; }
    });
    return best || (state.team[0]||{}).id || "";
  }
  function autoAssignOwners(){
    var todo = state.projects.filter(function(p){ return isActive(p) && !p.owner; })
                             .sort(function(a,b){ return bandRank(a) - bandRank(b); });
    todo.forEach(function(p){ saveProject(p, {owner: lightestMember()}); });
    return todo.length;
  }
  /* A task nobody touched was never really worked on, so it moves to today
     instead of piling up as "late". A task closed at end of day with a reason
     keeps its original date, because that delay is real. Runs on every load and
     writes only the tasks that actually need moving. */
  /* planned step dates that land on the weekly off move to the next working day */
  function fixOffDayPlans(){
    var t0 = today();
    state.projects.forEach(function(p){
      if(!(p.steps || []).some(function(st){ return st.status === "open" && st.plan && st.plan >= t0 && isOffDay(st.plan); })) return;
      saveProject(p, {steps:(p.steps || []).map(function(st){
        var x = Object.assign({}, st);
        if(x.status === "open" && x.plan && x.plan >= t0 && isOffDay(x.plan)) x.plan = workDay(x.plan);
        return x;
      })});
    });
    state.sdbs.forEach(function(sd){
      if(!(sd.steps || []).some(function(st){ return st.status !== "done" && st.plan && st.plan >= t0 && isOffDay(st.plan); })) return;
      saveSd(sd, {steps:(sd.steps || []).map(function(st){
        var x = Object.assign({}, st);
        if(x.status !== "done" && x.plan && x.plan >= t0 && isOffDay(x.plan)) x.plan = workDay(x.plan);
        return x;
      })});
    });
  }
  function rollForward(){
    if(!state.db || !state.canWrite) return 0;
    if(!state.offFixed && state.projects.length){ state.offFixed = true; try { fixOffDayPlans(); } catch(e){} }
    var moved = 0;
    state.tasks.forEach(function(t){
      if(t.status === "done") return;
      /* nothing is ever due on the weekly off: move it to the next working day */
      if(t.date && isOffDay(t.date) && t.date >= today()){
        var fix = {date: workDay(t.date)};
        if(t.plannedDate && isOffDay(t.plannedDate)) fix.plannedDate = workDay(t.plannedDate);
        saveTask(t, fix); moved++; return;
      }
      if(t.miss || (t.misses && t.misses.length)) return;
      if(t.plannedDate) return;          /* a committed special-DB date stands */
      if(t.date && t.date < today() && !isOffDay(today())){
        saveTask(t, {date: workToday(), rolled: (t.rolled||0) + 1});
        moved++;
      }
    });
    return moved;
  }
  function makeTask(p, assignee, date){
    var st = currentPStep(p);
    var d0 = workDay(date || (st && st.plan) || today());
    var t = {id:uid("T"), projectId:p.id, title:nextStep(p), assignee:assignee, date:d0, firstDate:d0,
            status:"open", createdAt:new Date().toISOString(), note:"", auto:true};
    if(st){ t.pStep = st.k; if(st.plan && !date) t.plannedDate = st.plan; }
    return t;
  }
  function buildDailyPlan(){
    autoAssignOwners();
    var made = 0;
    rollForward();
    /* process-flow projects: every active project always has its current step
       with someone, given to whoever has the lightest load */
    state.projects.filter(function(p){ return currentPStep(p) && !hasOpenStepTask(p); })
      .sort(function(a,b){ return bandRank(a) - bandRank(b); })
      .forEach(function(p){ if(openPStepTask(p)) made++; });
    state.team.forEach(function(m){
      var open = state.tasks.filter(function(t){ return t.assignee === m.id && t.status !== "done"; });
      var have = {}; open.forEach(function(t){ have[t.projectId] = true; });
      var room = CAPACITY - open.length;
      if(room <= 0) return;
      state.projects.filter(function(p){ return isActive(p) && !isOnHold(p) && p.owner === m.id && !have[p.id] && !currentPStep(p); })
        .sort(function(a,b){ return bandRank(a) - bandRank(b); })
        .slice(0, room)
        .forEach(function(p){ saveTask(makeTask(p, m.id)); made++; });
    });
    return made;
  }
  function maybeBuildDailyPlan(){
    if(state.planRan || !state.db || !state.projects.length || !state.canWrite) return;
    state.planRan = true;
    if(isOffDay(today())){ rollForward(); return; }       /* weekly off: no plan, no new tasks */
    var ref = state.db.doc("plans/" + today());
    ref.get().then(function(sn){
      if(sn.exists) return null;
      return ref.acquire({holder:"plan-" + Math.random().toString(36).slice(2), ttlMs:20000}).then(function(res){
        if(!res.acquired) return null;
        return ref.get().then(function(s2){
          if(s2.exists) return null;
          var made = buildDailyPlan();
          return ref.set({date:today(), createdAt:new Date().toISOString(), tasksCreated:made});
        });
      });
    }).catch(function(){});
  }
  function missEntries(mk, person){
    var out = [];
    state.tasks.forEach(function(t){
      (t.misses||[]).forEach(function(m){
        if(mk && monthKey(m.d) !== mk) return;
        if(person && (m.by || t.assignee) !== person) return;
        out.push({date:m.d, reason:m.reason || "Not given", note:m.note || "",
                  person:m.by || t.assignee, task:t, project:projById(t.projectId)});
      });
    });
    return out.sort(function(a,b){ return b.date.localeCompare(a.date); });
  }
  function reasonCounts(list){
    var map = {};
    list.forEach(function(m){ map[m.reason] = (map[m.reason]||0) + 1; });
    return Object.keys(map).map(function(k){ return {label:k, v:map[k]}; })
      .sort(function(a,b){ return b.v - a.v; });

    var list = (t.updates || []).map(function(x){ return Object.assign({}, x); });
    var cur = list.filter(function(x){ return x.d === today(); })[0];

      cur.t = cur.t ? cur.t + " · " + text : text; cur.at = new Date().toISOString(); cur.by = by || cur.by;

      list.unshift({d:today(), at:new Date().toISOString(), by:by || t.assignee, t:text, s:"note", logged:true});
    } else {
      cur.t = cur.t ? cur.t + " · " + text : text;      /* already closed today: add to it */
    }
    saveTask(t, {updates:list.slice(0, 40), note:text});
  }
