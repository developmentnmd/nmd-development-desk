  function projTable(items, kind, partHeaders){
    var t = el("table");
    var heads = [el("th",{},["Pri"]), el("th",{},[kind==="qve"?"Idea":"Project / part"]), el("th",{},["Stage"]),
                 el("th",{},["Status"]), el("th",{},["Owner · task with"]), el("th",{class:"n"},[kind==="qve"?"₹ saving / month":"₹ / month"])];
    if(kind === "live"){ heads.push(el("th",{class:"n"},["Growth"])); heads.push(el("th",{},["Target"])); }
    heads.push(el("th",{},["Last update"]));
    t.appendChild(el("thead",{},[el("tr",{}, heads)]));
    var tb = el("tbody");
    var span = heads.length;
    if(partHeaders){
      groupBy(items, function(p){ return p.part || "Part not set"; }).forEach(function(g){
        var v = g.items.filter(isActive).reduce(function(s,p){ return s+p._value; },0);
        tb.appendChild(el("tr",{class:"grouprow"},[ el("td",{class:"gcell", colspan:String(span), style:"background:var(--surface)"},[
          el("div",{style:"display:flex;gap:8px;align-items:center;flex-wrap:wrap"},[
            el("strong",{style:"font-size:12.5px"},[g.key]),
            el("span",{class:"chip"},[g.items.length + (g.items.length===1?" idea":" ideas")]),
            v ? el("span",{class:"chip"},[inr(v) + " / month"]) : null
          ])
        ])]));
        g.items.sort(function(a,b){ return bandRank(a) - bandRank(b); }).forEach(function(p){ tb.appendChild(projRow(p, kind)); });
      });
    } else {
      items.sort(function(a,b){ return bandRank(a) - bandRank(b); }).forEach(function(p){ tb.appendChild(projRow(p, kind)); });
    }
    t.appendChild(tb);
    return el("div",{class:"tablewrap projtable"},[t]);
  }
  function customerSections(kind){
    var list = state.projects.filter(function(p){ return passFilters(p, kind); });
    var groups = groupBy(list, function(p){ return (p.customer||"Not set").trim(); });
    if(!groups.length) return [el("div",{class:"card"},[el("div",{class:"empty"},[state.ready ? "Nothing matches these filters." : "Loading…"])])];
    return groups.map(function(g){
      var act = g.items.filter(isActive);
      var v = act.reduce(function(s,p){ return s+p._value; }, 0);
      var p1 = act.filter(function(p){ return p._band === "P1"; }).length;
      var card = el("div",{class:"card", style:"margin-bottom:12px"});
      card.appendChild(el("div",{class:"cardhead stick"},[
        el("span",{class:"cust-av", style:"--cc:var(--pc" + ((hashStr(g.key) % 4) + 1) + ")", "aria-hidden":"true"},[initials(g.key)]),
        el("h3",{},[g.key]),
        gradeChip(g.key),
        el("span",{class:"chip"},[act.length + " active of " + g.items.length]),
        el("span",{class:"chip"},[inr(v) + " / month"]),
        p1 ? el("span",{class:"chip p1"},[p1 + " × P1"]) : null,
        el("div",{class:"spacer", style:"flex:1"}),
        el("button",{class:"btn sm ghost", onclick:function(ev){ ev.stopPropagation(); openCustomer(g.key); }},["Customer card"])
      ]));
      card.appendChild(projTable(g.items, kind, kind === "qve"));
      return card;
    });
  }
  function viewLive(){
    var wrap = el("div");
    wrap.appendChild(blockHead("Live projects, customer wise",
      "Priority = value (" + state.scoring.wValue + ") + customer grade (" + state.scoring.wCustomer + ") + sale growth (" + state.scoring.wGrowth + ").",
      el("button",{class:"btn primary sm", onclick:function(){ openProjectForm("live"); }},["+ New project"])));
    wrap.appendChild(filterBar("live"));
    var pipeLive = stagePipeline("live"); if(pipeLive) wrap.appendChild(pipeLive);
    customerSections("live").forEach(function(c){ wrap.appendChild(c); });
    var noValue = state.projects.filter(function(p){ return p.type !== "qve" && isActive(p) && !valueKnown(p); });
    if(noValue.length) wrap.appendChild(needsValueCard(noValue));
    wrap.appendChild(reportCard("live"));
    return wrap;
  }
  function viewQve(){
    var wrap = el("div");
    wrap.appendChild(blockHead("QVE projects, customer wise and part wise",
      "Each customer is split by the part the change is made on.",
      el("button",{class:"btn primary sm", onclick:function(){ openProjectForm("qve"); }},["+ New QVE idea"])));
    wrap.appendChild(filterBar("qve"));
    var pipeQve = stagePipeline("qve"); if(pipeQve) wrap.appendChild(pipeQve);
    customerSections("qve").forEach(function(c){ wrap.appendChild(c); });
    var noValue = state.projects.filter(function(p){ return p.type === "qve" && isActive(p) && !valueKnown(p); });
    if(noValue.length) wrap.appendChild(needsValueCard(noValue));
    wrap.appendChild(reportCard("qve"));
    return wrap;
  }
  function needsValueCard(list){
    return el("div",{class:"card", style:"margin-top:8px"},[
      el("div",{class:"cardhead"},[el("h3",{},["Waiting for a value (" + list.length + ")"]),
        el("p",{class:"muted", style:"margin:0;font-size:12.5px"},["No priority until quantity and rate (or saving) are filled."])]),
      el("div",{class:"cardbody"}, list.map(function(p){
        return el("button",{class:"chip", style:"margin:3px 4px 3px 0;cursor:pointer", onclick:function(){ openProject(p.id); }},
          [p.id + " · " + p.customer + " · " + p.name]);
      }))
    ]);
  }

  /* ---------- SPECIAL DBs ---------- */
  function canUpload(){ return state.who === "atharva" || isLead(state.who); }
  /* one entry per SD code — if the same code is stored twice, show the one with more work done */
  function sdOfMonth(m){
    var best = {};
    state.sdbs.forEach(function(x){
      if(x.month !== m) return;
      var k = sdKey(x.sdCode), b = best[k];
      if(!b || sdProgress(x) > sdProgress(b) || (sdProgress(x) === sdProgress(b) && String(x.startedAt || x.createdAt || "") > String(b.startedAt || b.createdAt || ""))) best[k] = x;
    });
    return state.sdbs.filter(function(x){ return x.month === m && best[sdKey(x.sdCode)] === x; });
  }
  function orderOfMonth(m){ return state.sdorders.filter(function(x){ return x.id === m; })[0]; }

  function jcEsc(t){ return String(t == null ? "" : t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function jcUnesc(t){ return String(t).replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&amp;/g, "&"); }
  function jobCardValues(sd){
    var d = new Date(), dmy = pad(d.getDate()) + "/" + pad(d.getMonth() + 1) + "/" + d.getFullYear();
    return {"SD CODE":sd.sdCode, "DB DESCRIPTION":sd.desc || "", "ORDER QTY":String(+sd.orderQty || 0), "_DATE":dmy};
  }
  /* placeholder in quotes → value; any placeholder about a date ("date downloading",
     "START DATE", …) gets the day the card is downloaded, as dd/mm/yyyy */
  function jobCardFill(key, vals){
    var k = key.trim().toUpperCase();
    if(vals[k] != null) return vals[k];
    if(/DATE/.test(k)) return vals._DATE;
    return null;
  }
  function makeJobCard(sd){
    if(typeof JSZip === "undefined") return Promise.reject(new Error("The job card tool did not load. Reload the page and try again."));
    var vals = jobCardValues(sd);
    return JSZip.loadAsync(JOBCARD_B64, {base64:true}).then(function(zip){
      return Promise.all([zip.file("xl/sharedStrings.xml").async("string"), zip.file("xl/worksheets/sheet1.xml").async("string"),
                          zip.file("xl/workbook.xml").async("string")]).then(function(r){
        var strings = (r[0].match(/<si>[\s\S]*?<\/si>/g) || []).map(function(si){
          return jcUnesc((si.match(/<t[^>]*>([\s\S]*?)<\/t>/g) || []).map(function(t){ return t.replace(/<t[^>]*>|<\/t>/g, ""); }).join(""));
        });
        var sheet = r[1];
        /* every text cell that carries a "PLACEHOLDER" gets the real value */
        sheet = sheet.replace(/<c r="([A-Z]+\d+)"([^>]*?)t="s"([^>]*)><v>(\d+)<\/v><\/c>/g, function(all, ref, a1, a2, idx){
          var txt = strings[+idx];
          if(txt == null || !/"[A-Za-z ]+"/.test(txt)) return all;
          var out = txt.replace(/"([A-Za-z ]+)"/g, function(m, key){ var v = jobCardFill(key, vals); return v != null ? v : m; });
          if(out === txt) return all;
          return '<c r="' + ref + '"' + a1 + 't="inlineStr"' + a2 + '><is><t xml:space="preserve">' + jcEsc(out) + '</t></is></c>';
        });
        /* production table: description and quantity of this DB */
        sheet = sheet.replace(/<c r="E41"([^>]*?)\/>/, function(m, a){ return '<c r="E41"' + a + ' t="inlineStr"><is><t>' + jcEsc(sd.desc || sd.sdCode) + '</t></is></c>'; })
                     .replace(/<c r="F41"([^>]*)><v>[^<]*<\/v><\/c>/, function(m, a){ return '<c r="F41"' + a + '><v>' + (+sd.orderQty || 0) + '</v></c>'; });
        var wbx = r[2].replace(/<calcPr([^>]*?)\/>/, function(m, a){ return /fullCalcOnLoad/.test(a) ? m : '<calcPr' + a + ' fullCalcOnLoad="1"/>'; });
        zip.file("xl/worksheets/sheet1.xml", sheet);
        zip.file("xl/workbook.xml", wbx);
        return zip.generateAsync({type:"uint8array", compression:"DEFLATE"});
      });
    });
  }
  function jobCardName(sd){ return "Job_Card_" + String(sd.sdCode).replace(/[^A-Za-z0-9_-]/g, "_") + ".xlsx"; }
  function downloadJobCard(sd){
    banner("Making the job card for " + sd.sdCode + "…");
    makeJobCard(sd).then(function(bytes){
      return claude.use("downloads").then(function(d){
        if(!d){ banner("This view cannot save files. Open the dashboard in its own window."); return; }
        return d.save({filename:jobCardName(sd), data:bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength),
                       mimeType:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"})
          .then(function(){ banner(""); }, function(e){ banner(e && e.code === "declined" ? "" : "The job card could not be saved."); });
      });
    }).catch(function(e){ banner(String(e && e.message || e)); });
  }
  /* all repeat DBs of the list in one zip file */
  function downloadAllJobCards(list){
    if(typeof JSZip === "undefined"){ banner("The job card tool did not load. Reload the page and try again."); return; }
    banner("Making " + list.length + " job cards…");
    var out = new JSZip();
    Promise.all(list.map(function(sd){ return makeJobCard(sd).then(function(b){ out.file(jobCardName(sd), b); }); }))
      .then(function(){ return out.generateAsync({type:"arraybuffer"}); })
      .then(function(buf){
        return claude.use("downloads").then(function(d){
          if(!d){ banner("This view cannot save files. Open the dashboard in its own window."); return; }
          return d.save({filename:"Job_Cards_" + sdMonth() + "_repeat_DBs.zip", data:buf, mimeType:"application/zip"})
            .then(function(){ banner(""); }, function(e){ banner(e && e.code === "declined" ? "" : "The job cards could not be saved."); });
        });
      }).catch(function(e){ banner(String(e && e.message || e)); });
  }
  function stepBlocks(sd){
    var cur = currentStep(sd);
    return el("div",{class:"stepblocks"}, (sd.steps || []).map(function(st){
      var d = stepDelay(st), cls = st.status === "done" ? (d > 0 ? "late" : "ok") : (d > 0 ? "over" : (cur && cur.n === st.n ? "cur" : ""));
      return el("span",{class:"sblk " + cls, title:st.n + ". " + st.title.replace(" — " + sd.sdCode, "") + " · " + shortName(st.who) +
          " · planned " + (st.plan ? fmtDate(st.plan) : "—") + (st.doneAt ? " · done " + fmtDate(st.doneAt) : "") + (d > 0 ? " · +" + d + " d" : "")},
        [String(st.n), el("small",{},[st.status === "done" ? "✓ " + fmtDate(st.doneAt).replace(/ \d\d$/, "") : (st.plan ? fmtDate(st.plan).replace(/ \d\d$/, "") : "—")])]);
    }));
  }
  function viewSpecial(){
    var wrap = el("div");
    var m = sdMonth();
    var order = orderOfMonth(m);
    var list = sdOfMonth(m);

    var nav = el("div",{style:"display:flex;gap:6px;align-items:center"},[
      el("button",{class:"btn sm ghost", onclick:function(){
        var d = m.split("-"); var dt = new Date(+d[0], +d[1]-2, 1);
        state.sdMonth = dt.getFullYear()+"-"+pad(dt.getMonth()+1); render();
      }},["‹"]),
      el("span",{class:"chip"},[monthName(m)]),
      el("button",{class:"btn sm ghost", disabled: m >= shiftMonth(0) ? "disabled" : null, onclick:function(){
        var d = m.split("-"); var dt = new Date(+d[0], +d[1], 1);
        state.sdMonth = dt.getFullYear()+"-"+pad(dt.getMonth()+1); render();
      }},["›"])
    ]);
    wrap.appendChild(blockHead("Special DBs — Legrand customised",
      "Monthly schedule by SD code. New DBs go through full development; repeat DBs need the file updated.", nav));

    if(!order || !list.length){
      wrap.appendChild(el("div",{class:"card"},[
        el("div",{class:"cardbody", style:"text-align:center;padding:34px 16px"},[
          el("h3",{style:"font-size:17px;margin-bottom:6px"},["Please upload this month's order file"]),
          el("p",{class:"muted", style:"font-size:13px;margin:0 0 16px"},[
            canUpload() ? "Upload the Legrand schedule for " + monthName(m) + " (the NON STD sheet, in Excel). New DBs marked YES get the full development task list; the rest get a file-update task."
                        : "Atharva uploads the Legrand schedule at the start of every month. Nothing to show for " + monthName(m) + " yet."]),
          canUpload() ? uploadControl(m) : null
        ])
      ]));
      return wrap;
    }

    var news = list.filter(function(x){ return x.kind === "new"; });
    var reps = list.filter(function(x){ return x.kind !== "new"; });
    var dataPending = list.filter(function(x){ return sdMissing(x).length; });
    var openTasks = state.tasks.filter(function(t){ return t.sdId && t.status !== "done"; });
    var finished = list.filter(function(x){ return sdProgress(x) === 100; });

    wrap.appendChild(el("div",{class:"tiles"},[
      tile("DBs this month", String(list.length), news.length + " new · " + reps.length + " repeat", ""),
      tile("Waiting for customer data", String(dataPending.length), "CAD / GAD / BOM not available", dataPending.length ? "alert" : ""),
      tile("Pending qty", list.reduce(function(a, x){ return a + (+x.pendingQty || 0); }, 0).toLocaleString("en-IN"),
           "total across " + list.length + " DBs · " + openTasks.length + " open tasks", ""),
      tile("Completed", String(finished.length), "all steps ticked", "")
    ]));

    wrap.appendChild(el("div",{class:"card", style:"margin-top:14px"},[
      el("div",{class:"cardhead"},[
        el("h3",{},["Order file"]),
        el("span",{class:"chip"},[order.fileName || "uploaded"]),
        el("span",{class:"chip"},[(order.uploadedBy ? memberName(order.uploadedBy) : "—") + " · " + fmtDate((order.uploadedAt||"").slice(0,10))]),
        el("div",{class:"spacer", style:"flex:1"}),
        el("button",{class:"btn sm" + (state.sdOnlyPending ? " primary" : ""), onclick:function(){
          state.sdOnlyPending = !state.sdOnlyPending; render();
        }},[state.sdOnlyPending ? "Showing open DBs only" : "Show open DBs only"]),
        el("button",{class:"btn sm", onclick:function(){
          exportSdArchive(sdOfMonth(m), "NMD_Special_DB_Report_" + m + "_" + today() + ".xlsx").then(function(ok){
            if(!ok) banner("The Excel report could not be saved. Allow the download and try again.");
          });
        }},["Export report to Excel"]),
        canUpload() ? uploadControl(m, true) : null
      ])
    ]));

    [["New DBs — full development", news], ["Repeat DBs — file update", reps]].forEach(function(grp){
      if(!grp[1].length) return;

  function sdSteps(m){
    var out = [];

  function sdNote(m){ return state.sdnotes.filter(function(x){ return x.id === m; })[0]; }
  function improvementPoints(m){
    var pts = [];
    var rows = sdSteps(m);
    var doneRows = rows.filter(function(r){ return r.st.status === "done" && r.st.plan; });
    /* which step slips most */
    var byStep = {};
    doneRows.forEach(function(r){
      var key = r.st.title.replace(" — " + r.sd.sdCode, "");
      var d = stepDelay(r.st);
      if(!byStep[key]) byStep[key] = {sum:0, n:0, late:0};
      byStep[key].sum += d; byStep[key].n++; if(d > 0) byStep[key].late++;
    });
    var worst = Object.keys(byStep).map(function(k){
      return {step:k, avg:byStep[k].sum / byStep[k].n, late:byStep[k].late, n:byStep[k].n};
    }).filter(function(x){ return x.avg > 0; }).sort(function(a,b){ return b.avg - a.avg; })[0];
    if(worst) pts.push("Slowest step: " + worst.step + " — " + worst.avg.toFixed(1) +
      " days late on average (" + worst.late + " of " + worst.n + " DBs).");
    /* customer data */
    var waiting = sdOfMonth(m).filter(function(sd){ return sdMissing(sd).length; });
    if(waiting.length) pts.push(waiting.length + " DB" + (waiting.length===1?"":"s") +
      " still waiting for customer data (" + waiting.map(function(x){ return x.sdCode; }).slice(0,6).join(", ") + ").");
    /* hold-up reasons recorded on special DB tasks */
    var sdIds = {}; sdOfMonth(m).forEach(function(sd){ sdIds[sd.id] = true; });
    var reasons = {};
    state.tasks.forEach(function(t){
      if(!t.sdId || !sdIds[t.sdId]) return;
      (t.misses || []).forEach(function(x){ reasons[x.reason || "Not given"] = (reasons[x.reason || "Not given"]||0) + 1; });
    });
    var topReason = Object.keys(reasons).sort(function(a,b){ return reasons[b] - reasons[a]; })[0];
    if(topReason) pts.push("Most common hold-up: " + topReason + " — " + reasons[topReason] + " task-days lost.");
    /* overdue now */
    var overdue = rows.filter(function(r){ return r.st.status !== "done" && r.st.plan && dayDiff(today(), r.st.plan) > 0; });
    if(overdue.length) pts.push(overdue.length + " step" + (overdue.length===1?"":"s") + " are past their planned date right now.");
    /* on-time record */
    if(doneRows.length){
      var onTime = doneRows.filter(function(r){ return stepDelay(r.st) <= 0; }).length;
      pts.push("On-time completion: " + Math.round(onTime / doneRows.length * 100) + "% of " + doneRows.length + " finished steps.");
    }
    if(!pts.length) pts.push("Nothing to flag yet — the picture builds as steps get ticked.");
    return pts;
  }

    dbs.push(["", "TOTAL", "", "", "", "", list.reduce(function(a, x){ return a + (+x.orderQty || 0); }, 0),
              list.reduce(function(a, x){ return a + (+x.pendingQty || 0); }, 0)]);
    sheet(dbs, [5, 14, 34, 8, 9, 22, 10, 11, 8, 14, 14, 14, 14, 18, 12, 10, 10, 12, 13, 46, 18, 30], "2 DB details", 0);

    /* 3. tasks done in each DB — date and who did it */
    var td = [["SD code","Description","Type","Task no","Task done","Done on","Done by","Planned date","On time / late","Note / update"]];
    sorted.forEach(function(sd){
      (sd.steps || []).filter(function(st){ return st.status === "done"; }).forEach(function(st){
        var d = stepDelay(st);
        td.push([sd.sdCode, sd.desc || "", sd.kind === "new" ? "New" : "Repeat", st.n, st.title.replace(" — " + sd.sdCode, ""),
                 D(st.doneAt), memberName(sdStepDoneBy(sd, st, tasks)), D(st.plan),
                 d == null ? "" : (d > 0 ? d + " days late" : "On time"), sdStepNote(sd, st, tasks)]);
      });
    });
    if(td.length === 1) td.push(["", "", "", "", "No task finished yet"]);
    sheet(td, [14, 30, 8, 8, 56, 12, 22, 12, 14, 50], "3 Tasks done", 0);

    /* 4. what is still open */
    var op = [["SD code","Description","Task no","Task","With","Planned date","Days overdue","Last update"]];
    sorted.forEach(function(sd){
      (sd.steps || []).filter(function(st){ return st.status !== "done"; }).forEach(function(st){
        var late = st.plan ? dayDiff(today(), st.plan) : null;
        op.push([sd.sdCode, sd.desc || "", st.n, st.title.replace(" — " + sd.sdCode, ""), memberName(st.who), D(st.plan),

    /* 5. every update and hold-up */
    var upd = [["Date","SD code","Task","Person","What happened"]];
    tasks.forEach(function(t){
      if(!t.sdId || !ids[t.sdId]) return;
      var code = ids[t.sdId].sdCode, ttl = t.title.replace(" — " + code, "");
      (t.updates || []).forEach(function(u){
        upd.push([u.d, code, ttl, memberName(u.by), (u.s === "done" ? "Finished. " : "") + (u.r ? "Held up: " + u.r + ". " : "") + (u.t || "")]);
      });
      (t.misses || []).forEach(function(x){
        if(!(t.updates || []).some(function(u){ return u.d === x.d; }))
          upd.push([x.d, code, ttl, memberName(x.by || t.assignee), "Held up: " + (x.reason || "") + (x.note ? ". " + x.note : "")]);
      });
    });
    list.forEach(function(sd){ (sd.log || []).forEach(function(l){
      if(!upd.some(function(r){ return r[0] === l.d && r[1] === sd.sdCode && String(r[4]).indexOf(l.t || "") >= 0; }))
        upd.push([l.d, sd.sdCode, (l.task || "").replace(" — " + sd.sdCode, ""), memberName(l.by), l.t || ""]);
    }); });
    upd = [upd[0]].concat(upd.slice(1).sort(function(a, b){ return String(a[0]).localeCompare(String(b[0])) || String(a[1]).localeCompare(String(b[1])); })
      .map(function(r){ return [D(r[0])].concat(r.slice(1)); }));
    if(upd.length === 1) upd.push(["", "", "", "", "No updates written"]);
    sheet(upd, [12, 14, 52, 22, 70], "5 Updates and hold-ups", 0);

    var buf = XLSX.write(wb, {bookType:"xlsx", type:"array"});
    return claude.use("downloads").then(function(d){
      if(!d) return false;
      return d.save({filename:fileName, data:buf}).then(function(){ return true; }, function(){ return false; });
    }).catch(function(){ return false; });
  }

  function commitUpload(m, fileName, items, prev){
    var go = function(){ replaceSdData(m, fileName, items, prev); };
    if(!prev.length) return go();
    banner("Saving the previous Special DB data to Excel…");
    exportSdArchive(prev, "NMD_Special_DB_Report_" + (prev[0] && prev[0].month || "") + "_saved_" + today() + ".xlsx").then(function(ok){
      if(!ok){
        banner("The Excel file of the previous data could not be saved, so nothing was cleared. Allow the download and try again.");
        closeDrawer();
        return;
      }
      go();
    });
  }
  function replaceSdData(m, fileName, items, prev){
    var byKey = {}; items.forEach(function(i){ byKey[sdKey(i.sdCode)] = i; });
    var hist = Object.assign({}, state.sdhist || {});
    var added = 0, kept = 0, cleared = 0;
    var newIds = {}; items.forEach(function(i){ if(!i.carry) newIds[sdDocId(m, i.sdCode)] = true; });
    var tasksAll = state.allTasks || state.tasks;
    /* 1. the previous data: keep what is still in progress and in the new file, clear the rest */
    prev.forEach(function(sd){
      var k = sdKey(sd.sdCode), it = byKey[k];
      if(sdProgress(sd) === 100) hist[k] = sd.month;
      if(it && it.carry){
        var data = {orderQty:it.orderQty, pendingQty:it.pendingQty, lines:it.lines, poNos:it.poNos, cad:it.cad, gad:it.gad,
                    bom:it.bom, sfgCode:it.sfgCode, commDate:it.commDate, critical:it.critical, desc:it.desc || sd.desc, month:m};
        var nid = sdDocId(m, sd.sdCode);
        if(nid === sd.id){ saveSd(sd, data); }
        else {
          var moved = Object.assign({}, sd, data, {id:nid});
          saveSd(moved, {});
          tasksAll.filter(function(t){ return t.sdId === sd.id; }).forEach(function(t){ saveTask(t, {sdId:nid}); });
          deleteSd(sd);
        }
        kept++;
        return;
      }
      tasksAll.filter(function(t){ return t.sdId === sd.id && t.status !== "done"; }).forEach(function(t){ removeTask(t); });
      /* finished tasks of the old order stay as history but no longer point at the DB */
      tasksAll.filter(function(t){ return t.sdId === sd.id && t.status === "done"; }).forEach(function(t){ saveTask(t, {sdId:"", sdIdOld:sd.id, sdCode:sd.sdCode}); });
      if(newIds[sd.id]) state.sdbs = state.sdbs.filter(function(x){ return x.id !== sd.id; });   /* overwritten below */
      else deleteSd(sd);
      cleared++;
    });
    /* 2. the new file */
    items.forEach(function(i){
      if(i.carry) return;
      var sd = {id:sdDocId(m, i.sdCode), month:m, sdCode:i.sdCode, desc:i.desc, kind:i.kind,
                critical:i.critical, orderQty:i.orderQty, pendingQty:i.pendingQty, lines:i.lines,
                poNos:i.poNos, sfgItem:i.sfgItem, commDate:i.commDate, cad:i.cad, gad:i.gad,
                bom:i.bom, sfgCode:i.sfgCode, remarks:i.remarks || "", createdAt:today(), startDate:today(),
                startedAt:new Date().toISOString(), createdBy:state.who, steps:[], madeIn:i.prev || ""};
      sd.steps = buildSteps(sd);
      saveSd(sd, {});
      openStepTask(sd);
      added++;
    });
    /* 3. order records, notes and the history of finished codes */
    state.sdorders.filter(function(o){ return o.id !== m; }).forEach(function(o){
      if(state.db) state.db.doc("sdorders/" + o.id).delete().catch(onWriteErr);
    });
    state.sdnotes.forEach(function(n){ if(state.db) state.db.doc("sdnotes/" + n.id).delete().catch(onWriteErr); });
    state.sdnotes = [];
    state.sdhist = hist;
    if(state.db) state.db.doc("config/sdhistory").set({codes:hist}).catch(onWriteErr);
    var meta = {month:m, fileName:fileName, uploadedBy:state.who, uploadedAt:new Date().toISOString(),
                codes:items.length, newCodes:items.filter(function(i){ return i.kind === "new"; }).length};
    if(state.db) state.db.doc("sdorders/" + m).set(meta).catch(onWriteErr);
    state.sdorders = [Object.assign({id:m}, meta)];
    state.sdMonth = m;
    closeDrawer();
    banner((prev.length ? "Previous data saved to Excel and cleared (" + cleared + " DB" + (cleared === 1 ? "" : "s") + "). " : "") +
           monthName(m) + ": " + added + " DB" + (added === 1 ? "" : "s") + " loaded with their steps" +
           (kept ? ", " + kept + " in-progress DB" + (kept === 1 ? "" : "s") + " kept" : "") + ".");
    setTimeout(function(){ banner(""); }, 9000);
    render();
  }

  /* ---------- LIVE / QVE MONTHLY REPORT ---------- */
  function taskPlanDate(t){
    return t.plannedDate || t.firstDate || (t.createdAt || "").slice(0,10) || t.date || "";
  }
  function taskDelay(t){
    var p = taskPlanDate(t);
    if(!p) return null;
    if(t.status === "done") return dayDiff((t.doneAt || "").slice(0,10), p);
    var d = dayDiff(today(), p);
    return d > 0 ? d : 0;
  }
  function taskKind(t){
    var p = projById(t.projectId);
    if(p) return p.type === "qve" ? "qve" : "live";
    return t.sdId ? "sd" : "other";
  }
  function monthTasks(kind, mk){
    return state.tasks.filter(function(t){
      return taskKind(t) === kind && monthKey(taskPlanDate(t)) === mk;
    });
  }
  function taskMisses(list){
    var out = [];
    list.forEach(function(t){
      (t.misses || []).forEach(function(m){
        out.push({date:m.d, reason:m.reason || "Not given", note:m.note || "",
                  person:m.by || t.assignee, task:t, project:projById(t.projectId)});
      });
    });
    return out.sort(function(a,b){ return b.date.localeCompare(a.date); });
  }
  function reportPoints(kind, mk){
    var list = monthTasks(kind, mk);
    var done = list.filter(function(t){ return t.status === "done"; });
    var late = done.filter(function(t){ return taskDelay(t) > 0; });
    var ms = taskMisses(list);
    var pts = [];
    if(ms.length){
      var byReason = reasonCounts(ms);
      pts.push("Biggest time loss: " + byReason[0].label + " — " + byReason[0].v + " task-day" +
               (byReason[0].v === 1 ? "" : "s") + " of " + ms.length + " lost in the month.");
      var byPerson = {};
      ms.forEach(function(m){ byPerson[m.person] = (byPerson[m.person]||0) + 1; });
      var worst = Object.keys(byPerson).sort(function(a,b){ return byPerson[b] - byPerson[a]; })[0];
      if(worst) pts.push("Most blocked: " + memberName(worst) + " — " + byPerson[worst] + " task-days held up.");
      var byProj = {};
      ms.forEach(function(m){ if(m.project) byProj[m.project.id] = (byProj[m.project.id]||0) + 1; });
      var pw = Object.keys(byProj).sort(function(a,b){ return byProj[b] - byProj[a]; })[0];
      if(pw){
        var pp = projById(pw);
        pts.push("Worst-hit project: " + pp.id + " " + pp.customer + " — " + pp.name + " (" + byProj[pw] + " task-days).");
      }
    }
    if(done.length) pts.push("Finished on the planned day: " + Math.round((done.length - late.length)/done.length*100) +
      "% of " + done.length + " tasks.");
    var overdue = list.filter(function(t){ return t.status !== "done" && taskDelay(t) > 0; });
    if(overdue.length) pts.push(overdue.length + " task" + (overdue.length===1?"":"s") + " still open past the planned day.");
    var stale = state.projects.filter(function(p){
      if((kind === "qve") !== (p.type === "qve")) return false;
      if(!isActive(p)) return false;
      var last = (p.log && p.log.length) ? p.log[0].d : "";
      return !last || dayDiff(today(), last) > 7;
    });
    if(stale.length) pts.push(stale.length + " active " + (kind === "qve" ? "QVE idea" : "project") +
      (stale.length===1?"":"s") + " had no update for more than 7 days.");
    if(!pts.length) pts.push("No delay recorded yet for " + monthName(mk) + ".");
    return pts;
  }

    var ms = taskMisses(list);

        : [p.id, p.plant||"", p.customer, p.name, p.stage||"", p.status||"", p.owner?memberName(p.owner):"",
           p._band||"", Math.round(p._value||0), p.targetDate||"", last?last.t:"", last?last.d:""];
      ph.push(row);

    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(ph), label + " projects");

                  st.answer ? st.q + " " + (st.answer === "yes" ? "Yes" : "No") : ""]);
      });
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(stp), "Process steps");

    var buf = XLSX.write(wb, {bookType:"xlsx", type:"array"});
    claude.use("downloads").then(function(d){
      if(!d){ banner("This view cannot save files. Open the dashboard in its own window to export."); return; }
      return d.save({filename:"NMD_" + label + "_Report_" + mk + ".xlsx", data:buf})
        .then(function(){ banner(""); })
        .catch(function(e){ if(e && e.code !== "declined") banner("Export failed (" + e.code + ")."); });
    });
  }

  function monthStats(mk){

    state.tasks.forEach(function(t){
      var s = out[t.assignee]; if(!s) return;
      if(t.status === "done" && monthKey((t.doneAt||"").slice(0,10)) === mk){
        s.done++;
        if(!t.date || (t.doneAt||"").slice(0,10) <= t.date) s.onTime++;
      }
      if(t.status !== "done"){
        s.open++;
        var d = dayDiff(t.date, today());
        if(d < 0) s.late++; else if(d === 0) s.todayDue++;
      }
    });
    state.projects.forEach(function(p){
      var prev = null;
      (p.log||[]).slice().reverse().forEach(function(l){
        var s = out[l.by];
        if(s && monthKey(l.d) === mk){
          s.updates++;
          if(prev && l.stage && l.stage !== prev) s.advances++;
        }
        if(l.stage) prev = l.stage;
      });
      if(isActive(p) && out[p.owner]){ out[p.owner].owned++; out[p.owner].ownedValue += p._value; }
      if(p.completedOn && monthKey(p.completedOn) === mk && out[p.owner]) out[p.owner].value += p._value;
    });
    return out;

     headline numbers count up; skipped when the viewer asks for less motion */
  function playEnter(v){
    var calm = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    v.classList.remove("enter");
    if(calm) return;
    void v.offsetWidth;
    v.classList.add("enter");
    var items = v.querySelectorAll(".subtabs, .blockhead, .tiles > .tile, .filters, #view > div > .card, #view > div > section > .card, #view > div > div > .card, #view > div > section.block > .tiles > .tile");
    var seen = [], k = 0;
    Array.prototype.forEach.call(items, function(n){
      if(seen.indexOf(n) >= 0) return; seen.push(n);
      if(k < 14){ n.classList.add("rise"); n.style.animationDelay = (k * 45) + "ms"; }
      k++;
    });
    Array.prototype.forEach.call(v.querySelectorAll(".tile .val"), function(el){ countUp(el); });
  }
  function countUp(el){
    var txt = el.textContent, m = /^(\D*?)([\d,]+(?:\.\d+)?)(.*)$/.exec(txt);
    if(!m) return;
    var target = parseFloat(m[2].replace(/,/g, "")); if(!isFinite(target) || target === 0) return;
    var dec = (m[2].split(".")[1] || "").length, grouped = m[2].indexOf(",") >= 0;
    var t0 = null, dur = 750;
    function fmt(x){
      var s2 = dec ? x.toFixed(dec) : String(Math.round(x));
      return grouped ? Number(s2).toLocaleString("en-IN", {minimumFractionDigits:dec, maximumFractionDigits:dec}) : s2;
    }
    function step(ts){
      if(!el.isConnected) return;
      if(t0 === null) t0 = ts;
      var p = Math.min(1, (ts - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      el.textContent = m[1] + fmt(target * e) + m[3];
      if(p < 1) requestAnimationFrame(step); else el.textContent = txt;
    }
    requestAnimationFrame(step);
  }

  /* a window left open overnight: notice the date change, move untouched
     tasks to the new day and redraw, so nobody sees yesterday's screen */
  var dayWatch = today();
  setInterval(function(){
    if(today() === dayWatch) return;
    dayWatch = today();
    state.planRan = false;
    state.balChecked = false;
    rollForward();
    ensureDailyBalance();
    maybeBuildDailyPlan();
    render();
  }, 120000);

  boot();
})();
</script>
